      <div class="card"><h3>Carteira</h3>${c.rows.length ? `<div class="tw"><table><thead><tr><th>Ativo</th><th>Classe</th><th class="r">Qtd.</th><th class="r">Preço médio</th><th class="r">Cotação</th><th class="r">Valor de mercado</th><th class="r">Resultado</th><th class="r">%</th></tr></thead><tbody>${c.rows.sort((a, b) => a.a.ticker.localeCompare(b.a.ticker)).map((r) => { const f = r.a.currency === "USD" ? usd : brl; const pm = r.p.costCur / r.p.qty; return `<tr data-as="${r.a.id}" style="cursor:pointer"><td><b>${esc(r.a.ticker)}</b><div class="mut" style="font-size:12px">${esc(r.a.name)}</div></td><td class="mut">${esc(CLN[r.a.cls] || "")}</td><td class="r">${num(r.p.qty, 4)}</td><td class="r">${f(pm)}</td><td class="r">${f(r.a.price)}</td><td class="r">${f(r.mv)}</td><td class="r ${r.pnl >= 0 ? "pos" : "neg"}">${f(r.pnl)}</td><td class="r ${r.pnl >= 0 ? "pos" : "neg"}">${pct((r.pnl / r.p.costCur) * 100)}</td></tr>`; }).join("")}<tr class="total"><td colspan="5">Total exterior</td><td class="r">${usd(c.mvUSD)}</td><td class="r">${usd(pnl)}</td><td class="r">${cost ? pct((pnl / cost) * 100) : ""}</td></tr></tbody></table></div>` : `<div class="empty">Nenhuma posição. Importe os dados iniciais em Sistema › Dados ou lance as compras.</div>`}
      <div class="toolbar" style="margin-top:10px"><button class="btn ghost sm" id="iAsset">+ Ativo</button><span class="mut" style="font-size:12px">Clique num ativo para editar cotação, classe e código do IRPF.</span></div></div>`;
    $("#iNew", root).onclick = () => moveForm(); $("#iAsset", root).onclick = () => assetForm();
    $$("[data-as]", root).forEach((r) => (r.onclick = () => assetForm(d.assets.find((a) => a.id === r.dataset.as))));

  function quotesForm() {
    const d = D(); const held = carteira().rows.map((r) => r.a);
    const fields = [{ k: "fx", label: "Câmbio atual (R$/US$)", type: "number", step: "0.0001", value: d.fx.current }, { k: "cash", label: "Caixa na IBKR (US$)", type: "number", step: "0.01", value: (d.cash || {}).ibkr }]

  }

  function pMov(root) {
    const d = D(); const rows = d.moves.filter((m) => !S.broker || m.brokerId === S.broker).sort((a, b) => b.date.localeCompare(a.date));
    root.innerHTML = ERP.pagehead("Movimentações", `<button class="btn orange" id="iNew">+ Movimentação</button>`) + (rows.length ? `<div class="tw"><table><thead><tr><th>Data</th><th>Tipo</th><th>Ativo</th><th class="r">Qtd.</th><th class="r">Preço</th><th class="r">Valor</th><th class="r">PTAX</th><th>Obs.</th></tr></thead><tbody>${rows.map((m) => { const a = asset(m.assetId); const val = m.kind === "compra" || m.kind === "venda" ? m.qty * m.price : +m.amount; return `<tr data-mv="${m.id}" style="cursor:pointer"><td>${fdate(m.date)}</td><td><span class="pill ${m.kind === "compra" ? "info" : m.kind === "venda" ? "warn" : m.kind === "dividendo" ? "ok" : ""}">${KN[m.kind]}</span></td><td>${m.assetId ? esc(a.ticker) : "—"}</td><td class="r">${m.qty ? num(m.qty, 4) : ""}</td><td class="r">${m.price ? num(m.price, 2) : ""}</td><td class="r">${num(val, 2)}</td><td class="r mut">${m.fx ? num(m.fx, 4) : "tabela"}</td><td class="mut">${esc(m.notes || "")}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma movimentação.</div>`);
    $("#iNew", root).onclick = () => moveForm();
    $$("[data-mv]", root).forEach((r) => (r.onclick = () => moveForm(d.moves.find((m) => m.id === r.dataset.mv))));
  }

  function pIR(root) {
    const d = D(); const y = S.year; const end = y + "-12-31"; const ptaxEnd = d.fx.ptax[end];
    const P = positions(end); const Pprev = positions((y - 1) + "-12-31");
    const bens = d.assets.map((a) => ({ a, p: P[a.id], pp: Pprev[a.id] })).filter((x) => (x.p && x.p.qty > 0) || (x.pp && x.pp.qty > 0));
    const real = []; Object.entries(positions(end)).forEach(([id, p]) => p.realized.filter((r) => r.date.slice(0, 4) === String(y)).forEach((r) => real.push(Object.assign({ a: asset(id) }, r))));
    const gain = real.reduce((s, r) => s + r.gainBRL, 0);
    const ofY = (k) => d.moves.filter((m) => m.kind === k && m.date.slice(0, 4) === String(y));
    const divBRL = ofY("dividendo").reduce((s, m) => s + +m.amount * (+m.fx || ptaxOn(m.date)), 0);
    const jurBRL = ofY("juros").reduce((s, m) => s + +m.amount * (+m.fx || ptaxOn(m.date)), 0);
    const taxBRL = ofY("imposto").reduce((s, m) => s + +m.amount * (+m.fx || ptaxOn(m.date)), 0);
    const divUSD = ofY("dividendo").reduce((s, m) => s + +m.amount, 0), taxUSD = ofY("imposto").reduce((s, m) => s + +m.amount, 0);
    const base = Math.max(0, gain + divBRL + jurBRL); const imposto15 = base * 0.15; const credito = Math.min(taxBRL, (divBRL + jurBRL) * 0.15);
    const devido = Math.max(0, imposto15 - credito);
    const cashUSD = (d.cash || {}).ibkr || 0;
    root.innerHTML = ERP.pagehead("IR do ano-base " + y, `<button class="btn ghost sm" data-y="-1">‹ ${y - 1}</button><button class="btn ghost sm" data-y="1">${y + 1} ›</button><button class="btn ghost" onclick="print()">Imprimir / PDF</button>`) + `
      <div class="note info">Regra usada: aplicações no exterior de pessoa física (Lei 14.754/2023, a partir de 2024) — ganhos, dividendos e juros somados no ano e tributados a 15% na declaração anual, com crédito do imposto retido lá fora até o limite do imposto brasileiro sobre esses rendimentos. Custo e venda convertidos pela PTAX de cada data. É um apoio de cálculo: confira com seu contador antes de entregar.</div>
      ${ptaxEnd ? "" : `<div class="note">Falta a PTAX de 31/12/${y} em Configurações (usada para o saldo em conta).</div>`}
      <div class="kpis">${ERP.kpi("Ganho de capital realizado", brl(gain), real.length + " venda(s)", gain >= 0 ? "" : "neg")}${ERP.kpi("Dividendos + juros", brl(divBRL + jurBRL), usd(divUSD) + " brutos")}${ERP.kpi("Imposto pago no exterior", brl(taxBRL), usd(taxUSD))}${ERP.kpi("Estimativa a pagar (15%)", brl(devido), "base " + brl(base) + (gain < 0 ? " · prejuízo compensa rendimentos do ano" : ""), devido > 0 ? "neg" : "pos")}</div>
      <div class="card"><h3>Bens e direitos em 31/12 <small class="mut" style="font-weight:400">custo de aquisição em R$</small></h3><div class="tw"><table><thead><tr><th>Ativo</th><th>Grupo/Código</th><th>Discriminação sugerida</th><th class="r">31/12/${y - 1}</th><th class="r">31/12/${y}</th></tr></thead><tbody>
      ${bens.map(({ a, p, pp }) => `<tr><td><b>${esc(a.ticker)}</b></td><td>${a.irpf ? esc(a.irpf) : '<span class="pill warn">definir</span>'}</td><td class="mut" style="font-size:12px">${num(p ? p.qty : 0, 4)} cotas ${esc(a.ticker)} (${esc(a.name)}), custodiadas na ${esc(((d.brokers.find((b) => b.id === a.brokerId) || {}).name) || "")}, EUA. Custo US$ ${num(p ? p.costCur : 0)}.</td><td class="r">${brl(pp ? pp.costBRL : 0)}</td><td class="r">${brl(p ? p.costBRL : 0)}</td></tr>`).join("")}
      <tr><td><b>Caixa IBKR</b></td><td class="mut">conta no exterior</td><td class="mut" style="font-size:12px">Saldo em conta na Interactive Brokers: US$ ${num(cashUSD)} × PTAX ${ptaxEnd ? num(ptaxEnd, 4) : "?"}. (Saldo atual — ajuste para o de 31/12.)</td><td class="r"></td><td class="r">${ptaxEnd ? brl(cashUSD * ptaxEnd) : "—"}</td></tr>
      <tr class="total"><td colspan="3">Total</td><td class="r">${brl(bens.reduce((s, x) => s + (x.pp ? x.pp.costBRL : 0), 0))}</td><td class="r">${brl(bens.reduce((s, x) => s + (x.p ? x.p.costBRL : 0), 0))}</td></tr></tbody></table></div></div>
      <div class="card"><h3>Vendas no ano</h3>${real.length ? `<div class="tw"><table><thead><tr><th>Data</th><th>Ativo</th><th class="r">Qtd.</th><th class="r">Venda (R$)</th><th class="r">Custo (R$)</th><th class="r">Ganho (R$)</th></tr></thead><tbody>${real.map((r) => `<tr><td>${fdate(r.date)}</td><td>${esc(r.a.ticker)}</td><td class="r">${num(r.qty, 4)}</td><td class="r">${brl(r.procBRL)}</td><td class="r">${brl(r.costBRL)}</td><td class="r ${r.gainBRL >= 0 ? "pos" : "neg"}">${brl(r.gainBRL)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma venda em ${y}.</div>`}</div>`;
    $$("[data-y]", root).forEach((b) => (b.onclick = () => { S.year += +b.dataset.y; ERP.render(); }));
  }

  function pConf(root) {
    const d = D(); const rows = Object.entries(d.fx.ptax).sort((a, b) => b[0].localeCompare(a[0]));
    root.innerHTML = ERP.pagehead("Configurações de investimentos") + `
      <div class="card"><h3>Tabela de PTAX (venda, Banco Central)</h3><p class="mut" style="margin-bottom:10px">Usada quando a movimentação não tem câmbio próprio: vale a PTAX da data mais recente até o dia. Inclua sempre a de 31/12 de cada ano.</p>
      <div class="tw"><table><thead><tr><th>Data</th><th class="r">R$ por US$</th><th></th></tr></thead><tbody>${rows.map(([k, v]) => `<tr><td>${fdate(k)}</td><td class="r">${num(v, 4)}</td><td class="r"><button class="btn ghost sm" data-delptax="${k}">Remover</button></td></tr>`).join("")}</tbody></table></div>
      <div class="toolbar" style="margin-top:10px"><input type="date" id="pxD"><input id="pxV" placeholder="5,5024" style="width:110px"><button class="btn sm" id="pxAdd">Adicionar</button></div></div>
      <div class="card"><h3>Corretoras</h3>${d.brokers.map((b) => `<div>${esc(b.name)} <span class="mut">· ${esc(b.country)} · ${esc(b.currency)}</span></div>`).join("")}<div class="toolbar" style="margin-top:10px"><button class="btn ghost sm" id="brAdd">+ Corretora</button></div></div>`;
    $("#pxAdd", root).onclick = () => { const k = $("#pxD", root).value, v = ERP.parseNum($("#pxV", root).value); if (!k || !v) { ERP.toast("Informe data e valor."); return; } Store.change("investimentos", (dd) => { dd.fx.ptax[k] = v; }); ERP.render(); };
    $$("[data-delptax]", root).forEach((b) => (b.onclick = () => { Store.change("investimentos", (dd) => { delete dd.fx.ptax[b.dataset.delptax]; }); ERP.render(); }));
    $("#brAdd", root).onclick = () => ERP.form({ title: "Nova corretora", fields: [{ k: "name", label: "Nome", required: true }, { k: "country", label: "País", value: "Brasil" }, { k: "currency", label: "Moeda", type: "select", value: "BRL", options: [["BRL", "BRL"], ["USD", "USD"], ["EUR", "EUR"]] }], onSubmit(v) { Store.change("investimentos", (dd) => dd.brokers.push(Object.assign({ id: uid("br") }, v))); ERP.render(); } });
  }

  ERP.register({ id: "investimentos", label: "Investimentos", tab: "Investir", icon: "trending-up", group: "Finanças", pages: [
    { id: "carteira", label: "Carteira", render: pCarteira }, { id: "movimentacoes", label: "Movimentações", render: pMov },
    { id: "ir", label: "Imposto de Renda", render: pIR }, { id: "config", label: "Configurações", render: pConf } ] });
})();

</script>
<script>/* js/mod-patrimonio.js */
/* Patrimônio & Aposentadoria — no formato do Piloto 3.0: patrimônio bruto, rentabilidade, dívidas de curto prazo, líquido,
   cobertura, composição por espécie, projeto de aposentadoria, ativos e aplicações (R$/US$) com aportes e resgates,
   bens e dívidas, fotos mensais da evolução. Lê sozinho as contas e dívidas de Finanças e a carteira de Investimentos. */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, usd, num, todayISO, fdate, monthLabel, Store } = ERP;
  ERP.defaults.patrimonio = { items: [], snapshots: [] };
  const KIND = [["aplicacao", "Aplicação financeira"], ["imovel", "Imóvel"], ["veiculo", "Veículo"], ["previdencia", "Previdência"], ["participacao", "Participação societária"], ["outro_bem", "Outro bem"], ["divida", "Dívida / financiamento (fora de Finanças)"]];
  const KN = Object.fromEntries(KIND);
  const ESPECIES = ["Poupança", "CDB / Renda fixa", "Tesouro Direto", "Fundos", "Ações BR", "FIIs", "Ações / ETFs EUA", "Cripto", "Previdência privada", "Caixa / Conta", "Outros"];
  const PC = ["#8FA8C6", "#74C69D", "#7BA7DE", "#B49BE4", "#E0B060", "#E58F94", "#7FC4BD", "#C9A0E8", "#E9C46A", "#A5AFBD", "#9BB0C9", "#C3CCD9"];
  const D = () => Store.get("patrimonio");
  const fx = () => (ERP.investimentos ? +ERP.investimentos.fx() || 0 : 0);
  const emBRL = (i) => (i.moeda === "USD" ? (+i.value || 0) * fx() : +i.value || 0);
  const invBRL = (i) => (i.investido == null || i.investido === "" ? null : i.moeda === "USD" ? +i.investido * fx() : +i.investido);

  function total() {
    const F = ERP.fin; const h = todayISO(); const lim30 = F.addDias(h, 30);
    const contas = F.contasAtivas().map((c) => F.saldoConta(c.id));
    const accPos = contas.filter((v) => v > 0).reduce((s, v) => s + v, 0), accNeg = -contas.filter((v) => v < 0).reduce((s, v) => s + v, 0);
    const cart = ERP.investimentos.carteira(); const inv = cart.totalBRL;
    const items = D().items; const ativos = items.filter((i) => i.kind !== "divida");
    const bens = ativos.reduce((s, i) => s + emBRL(i), 0);
    const pend = F.pendencias().filter((p) => p.tipo !== "receita" && p.tipo !== "transferencia");
    const curto = accNeg + pend.filter((p) => p.data <= lim30).reduce((s, p) => s + p.valor, 0);
    const dividas = F.D().dividas.reduce((s, dv) => s + F.dividaInfo(dv).saldo, 0);
    const parc30 = F.D().lanc.filter((l) => l.dividaId && !l.pago && l.venc <= lim30).reduce((s, l) => s + l.valor, 0);
    const longo = Math.max(0, dividas - parc30) + items.filter((i) => i.kind === "divida").reduce((s, i) => s + (+i.value || 0), 0);
    const bruto = accPos + inv + bens; const usdBRL = (cart.mvUSD + cart.cashUSD) * fx() + ativos.filter((i) => i.moeda === "USD").reduce((s, i) => s + emBRL(i), 0);
    /* rentabilidade: aplicações com "investido" + carteira do exterior (custo em US$ ao câmbio de hoje) */
    const comBase = ativos.filter((i) => invBRL(i) != null); let investido = comBase.reduce((s, i) => s + invBRL(i), 0), atual = comBase.reduce((s, i) => s + emBRL(i), 0);
    cart.rows.forEach((r) => { if (r.a.currency === "USD") { investido += r.p.costCur * fx(); atual += r.mv * fx(); } });
    return { acc: accPos - accNeg, accPos, accNeg, inv, bens, bruto, usdBRL, curto, longo, div: curto + longo, net: bruto - curto - longo, investido, atual, rent: atual - investido, rentPct: investido > 0 ? ((atual - investido) / investido) * 100 : 0 };
  }
  ERP.patrimonio = { total };

  function itemForm(it) {
    const isNew = !it; it = it || { kind: "aplicacao", moeda: "BRL", especie: "CDB / Renda fixa", date: todayISO() };

      onSubmit(v) { if (v.investido === 0 && !String(it.investido || "")) v.investido = null; Store.change("patrimonio", (d) => { if (isNew) d.items.push(Object.assign({ id: uid("pt"), hist: [] }, v)); else Object.assign(d.items.find((x) => x.id === it.id), v); }); ERP.render(); },

  /* aporte / resgate (Piloto 3.0): ajusta investido e valor e, se quiser, lança em Finanças fora da DRE */
  function movForm(it, tipo) {

      fields: [{ k: "valor", label: `Valor (${it.moeda === "USD" ? "US$" : "R$"})`, type: "number", step: "0.01" }, { k: "data", label: "Data", type: "date", value: todayISO() }, { k: "lanc", label: ap ? "Lançar a saída da conta em Finanças" : "Lançar a entrada na conta em Finanças", type: "checkbox", value: it.moeda !== "USD" }, { k: "contaId", label: "Conta", type: "select", options: F.contasAtivas().map((c) => [c.id, c.nome]) }],
      okLabel: ap ? "Registrar aporte" : "Registrar resgate",

        if (v.lanc) { const cats = F.D().categorias; const cid = (cats.find((c) => (ap ? /Aportes em investimentos/ : /Resgates de investimentos/).test(c.nome)) || {}).id; const brlV = it.moeda === "USD" ? v.valor * fx() : v.valor;
          ERP.finUI.salvar((dd) => dd.lanc.push({ id: uid("l"), tipo: ap ? "despesa" : "receita", desc: (ap ? "Aporte · " : "Resgate · ") + it.name, catId: cid, valor: F.r2(brlV), contaId: v.contaId, comp: v.data, venc: v.data, pago: v.data, valorPago: F.r2(brlV), forma: "Transferência", hist: [{ em: new Date().toISOString(), o: "Lançado pelo Patrimônio" }] })); }
        ERP.toast(ap ? "Aporte registrado." : "Resgate registrado."); ERP.render();
      } });

  function render(root) {
    const t = total(); const d = D(); const F = ERP.fin; const c = F.D().cfg;
    const ativos = d.items.filter((i) => i.kind !== "divida");
    /* composição por espécie */
    const por = {}; const add = (k, v) => { if (v > 0) por[k] = (por[k] || 0) + v; };
    add("Caixa / Conta", t.accPos); add("Ações / ETFs EUA (Investimentos)", t.inv); ativos.forEach((i) => add(i.kind === "aplicacao" ? i.especie || "Outros" : KN[i.kind], emBRL(i)));
    const ents = Object.entries(por).sort((a, b) => b[1] - a[1]);
    /* aposentadoria (parâmetros de Metas e planejamento) */
    const anos = Math.max(1, (c.idadeApos || 60) - (c.idade || 40)); const i = Math.pow(1 + (c.retornoReal || 4) / 100, 1 / 12) - 1;
    let fv = Math.max(0, t.net); const serie = [{ x: 0, v: fv }]; for (let k = 1; k <= anos * 12; k++) { fv = fv * (1 + i) + (+c.aporteApos || 0); if (k % 12 === 0) serie.push({ x: k / 12, v: fv }); }

      <div class="grid2"><div class="card"><h3 class="fp-h3">Composição por espécie <small>convertido para R$ · US$ 1 = R$ ${num(fx(), 4)}</small></h3>${ents.length ? `<div class="fp-chart" style="height:260px"><canvas id="chPatCls"></canvas></div>` : `<div class="empty">Nenhum ativo — use “+ Novo ativo”.</div>`}</div>

        ${t.inv ? `<tr><td><b>Carteira no exterior</b><div class="mut fin-sub">módulo Investimentos (IBKR)</div></td><td>Ações / ETFs EUA</td><td class="r mut" colspan="2"><a href="#/investimentos/carteira">abrir carteira</a></td><td class="r">${brl(t.inv)}</td><td></td><td></td></tr>` : ""}
        ${ativos.map((i) => { const f = (v) => (i.moeda === "USD" ? usd(v) : brl(v)); const ib = invBRL(i); const ret = ib != null ? emBRL(i) - ib : null; return `<tr><td><b>${esc(i.name)}</b><div class="mut fin-sub">${fdate(i.date)}${i.hist && i.hist.length ? " · " + i.hist.length + " movimento(s)" : ""}</div></td><td>${esc(i.kind === "aplicacao" ? i.especie || "Outros" : KN[i.kind])}</td><td class="r">${i.investido != null && i.investido !== "" ? f(i.investido) : "—"}</td><td class="r">${f(i.value)}</td><td class="r">${brl(emBRL(i))}</td><td class="r ${ret == null ? "" : ret >= 0 ? "pos" : "neg"}">${ret == null ? "—" : (ret >= 0 ? "+" : "") + num(ib ? (ret / ib) * 100 : 0, 1) + "%"}</td><td class="r fp-acts">${i.kind === "aplicacao" || i.kind === "previdencia" ? `<button class="ib ok" data-ap="${i.id}" title="Aporte">＋</button><button class="ib" data-rs="${i.id}" title="Resgate">−</button>` : ""}<button class="ib" data-it="${i.id}" title="Editar">✎</button></td></tr>`; }).join("") || (t.inv ? "" : `<tr><td colspan="7" class="empty">Nenhum ativo cadastrado. Lance poupança, CDB, Tesouro, fundos, imóveis e veículos em R$ ou US$.</td></tr>`)}</tbody></table></div></div>

    $("#pNew", root).onclick = () => itemForm(); $("#pNew2", root).onclick = () => itemForm();

  }
  ERP.register({ id: "patrimonio", label: "Patrimônio", icon: "landmark", group: "Finanças", render });

<script>/* js/mod-sistema.js */
/* Sistema — dados e sincronização (OneDrive), backup, importação de dados iniciais, sobre */
(function () {
  "use strict";
  const { $, esc, todayISO, Store, Cloud } = ERP;

  function importFile(file, mode) {
    const r = new FileReader();
    r.onload = async () => {
      let j; try { j = JSON.parse(r.result); } catch (e) { ERP.toast("Arquivo inválido."); return; }
      const docs = j.docs || (j.doc && j.data ? { [j.doc]: j.data } : null);
      if (!docs) { ERP.toast("Este arquivo não é um backup do ERP Rafael."); return; }
      const names = Object.keys(docs).filter((n) => ERP.defaults[n]);
      const label = names.join(", ");
      if (!(await ERP.confirm(`${mode === "merge" ? "Juntar" : "Substituir"} os dados de: ${label}? ${mode === "merge" ? "Itens com o mesmo ID são atualizados; os demais são mantidos." : "Os dados atuais desses módulos serão trocados."}`, "Importar"))) return;
      names.forEach((n) => Store.change(n, (cur) => {
        const inc = docs[n];
        Object.keys(inc).forEach((k) => {
          if (mode === "merge" && Array.isArray(inc[k]) && Array.isArray(cur[k])) { const by = new Map(cur[k].map((x) => [x.id, x])); inc[k].forEach((x) => by.set(x.id, Object.assign(by.get(x.id) || {}, x))); cur[k] = Array.from(by.values()); }
          else if (mode === "merge" && inc[k] && typeof inc[k] === "object" && !Array.isArray(inc[k]) && cur[k] && typeof cur[k] === "object") cur[k] = Object.assign({}, cur[k], inc[k], k === "fx" ? { ptax: Object.assign({}, cur[k].ptax, inc[k].ptax) } : {});
          else cur[k] = inc[k];
        });
      }));
      ERP.toast("Importado: " + label); ERP.render();
    };
    r.readAsText(file);
  }

  function pDados(root) {
    const cfg = Cloud.cfg();
    const st = Store.names().map((n) => { const m = Store.meta[n]; return `<tr><td>${esc(n)}.json</td><td>${m.updatedAt ? new Date(m.updatedAt).toLocaleString("pt-BR") : "—"}</td><td>${m.dirty ? '<span class="pill warn">pendente</span>' : m.etag ? '<span class="pill ok">no OneDrive</span>' : '<span class="pill">só local</span>'}</td></tr>`; }).join("");
    root.innerHTML = ERP.pagehead("Dados e sincronização") + `
      <div class="card"><h3>OneDrive (fonte oficial dos dados)</h3>
        <p style="margin-bottom:10px">Os dados ficam num arquivo JSON por módulo na pasta <b>ERP Rafael</b> do OneDrive da conta Microsoft pessoal. Cada aparelho guarda uma cópia de trabalho e sincroniza ao abrir e ao editar. O código no GitHub é público e não contém dados.</p>
        <p class="mut" style="margin-bottom:10px">O login aceita só contas Microsoft <b>pessoais</b> (rafael.oertel@gmail.com). Contas corporativas, como a da Nova Macabu, são recusadas pela própria Microsoft — os dados nunca vão para o OneDrive da empresa.</p>
        <p class="mut" style="margin-bottom:12px">Situação: <b>${esc(Cloud.msg)}</b>${Cloud.account ? " · conta " + esc(Cloud.account.username) : ""}</p>
        <div class="fg" style="max-width:640px"><div class="f full"><label for="cid">ID do aplicativo (Microsoft Entra · “Application (client) ID”)</label><input id="cid" value="${esc(cfg.clientId || "")}" placeholder="00000000-0000-0000-0000-000000000000"></div></div>
        <div class="toolbar" style="margin-top:12px"><button class="btn ghost" id="cSave">Salvar ID</button>${Cloud.account ? `<button class="btn" id="cSync">Sincronizar agora</button><button class="btn ghost" id="cOut">Sair da conta</button>` : `<button class="btn orange" id="cIn">Entrar com Microsoft</button>`}</div>
        <p class="mut" style="font-size:12.5px;margin-top:8px">Endereço de retorno para cadastrar no aplicativo: <code>${esc(Cloud.redirectUri())}</code> (tipo “Aplicativo de página única — SPA”).</p></div>
      <div class="card"><h3>Arquivos</h3><div class="tw"><table><thead><tr><th>Arquivo</th><th>Última alteração</th><th>Situação</th></tr></thead><tbody>${st}</tbody></table></div></div>
      <div class="card"><h3>Backup e importação</h3>
        <p class="mut" style="margin-bottom:10px">Use “Juntar” para carregar os dados iniciais (arquivo enviado pelo Claude) sem apagar o que já existe.</p>
        <div class="toolbar"><button class="btn ghost" id="bExp">Baixar backup completo</button><label class="btn ghost" style="cursor:pointer">Importar e juntar<input type="file" accept=".json,application/json" id="iMerge" hidden></label><label class="btn ghost" style="cursor:pointer">Importar e substituir<input type="file" accept=".json,application/json" id="iRep" hidden></label></div></div>
      <div class="card"><h3>Dados de exemplo</h3><p class="mut" style="margin-bottom:10px">Para conhecer Finanças Pessoais com números: carrega uma conta, um cartão, recorrências, compras, um empréstimo e uma meta, todos marcados como exemplo. Remover apaga só eles.</p><div class="toolbar">${ERP.temExemplo() ? `<button class="btn ghost" id="exRem">Remover exemplos</button>` : `<button class="btn ghost" id="exAdd">Carregar exemplo</button>`}</div></div>
      <div class="card"><h3>Aparência</h3><p class="mut" style="margin-bottom:12px">Automático acompanha o modo claro ou escuro do aparelho. O botão de lua/sol no menu alterna na hora.</p><div class="tabs" id="aTheme" style="margin:0">${[["auto", "Automático"], ["light", "Claro"], ["dark", "Escuro"]].map(([k, n]) => `<button data-th="${k}" class="${ERP.theme() === k ? "on" : ""}">${n}</button>`).join("")}</div></div>
      <div class="card"><h3>Sobre</h3><p>ERP Rafael ${esc(ERP.version)} · módulos: ${ERP.modules.map((m) => esc(m.label)).join(", ")}.</p></div>`;
    $("#aTheme", root).onclick = (e) => { const b = e.target.closest("[data-th]"); if (b) ERP.setTheme(b.dataset.th); };
    $("#cSave", root).onclick = () => { ERP.lsSet("cloud", { clientId: $("#cid", root).value.trim() }); ERP.toast("ID salvo. Recarregando…"); setTimeout(() => location.reload(), 600); };
    const i = $("#cIn", root); if (i) i.onclick = () => Cloud.login();
    const s = $("#cSync", root); if (s) s.onclick = async () => { await Cloud.pullAll(); for (const n of Store.names()) if (Store.meta[n].dirty) await Cloud.push(n).catch(() => {}); ERP.render(); };
    const o = $("#cOut", root); if (o) o.onclick = () => Cloud.logout();
    const ea = $("#exAdd", root); if (ea) ea.onclick = () => ERP.finExemplo();
    const er = $("#exRem", root); if (er) er.onclick = () => ERP.confirm("Remover todos os dados de exemplo?", "Remover").then((ok) => ok && ERP.finRemoverExemplo());
    $("#bExp", root).onclick = () => { const docs = {}; Store.names().forEach((n) => (docs[n] = Store.get(n))); ERP.download(`erp-rafael-backup-${todayISO()}.json`, JSON.stringify({ app: "erp-rafael", version: ERP.version, savedAt: new Date().toISOString(), docs }, null, 2)); };
    $("#iMerge", root).onchange = (e) => e.target.files[0] && importFile(e.target.files[0], "merge");
    $("#iRep", root).onchange = (e) => e.target.files[0] && importFile(e.target.files[0], "replace");
  }
  ERP.register({ id: "sistema", label: "Sistema", icon: "settings", group: "Sistema", pages: [{ id: "dados", label: "Dados e sincronização", render: pDados }] });
})();

</script>
<script>ERP.boot();</script>
</body>
</html>
