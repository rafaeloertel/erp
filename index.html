<script>/* js/mod-inicio.js */
/* Início — resumo do dia: posição financeira, contas a pagar e tarefas */
(function () {
  "use strict";
  const { esc, brl, usd, fdate, monthKey, monthLabel, todayISO, $ } = ERP;
  const DIAS = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
  const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

  function render(root) {
    const hoje = todayISO(); const mk = monthKey(hoje); const dt = new Date();
    const f = ERP.custos.monthFlow(mk); const inv = ERP.investimentos.carteira(); const pat = ERP.patrimonio.total();
    const saldo = ERP.fin.saldoTotal(); const res = f.rec - f.desp;
    const due = ERP.reminders.dueToday(); const abertas = ERP.reminders.openCount();
    const lim = ERP.fin.addDias(hoje, 30);
    const bills = ERP.custos.billsOpen().filter((b) => b.due <= lim).sort((a, b) => a.due.localeCompare(b.due));
    const venc = bills.filter((b) => b.due < hoje); const totBills = bills.reduce((s, b) => s + b.amount, 0);
    const h = dt.getHours(); const hi = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
    const data = `${DIAS[dt.getDay()]}, ${dt.getDate()} de ${MESES[dt.getMonth()]}`;

    root.innerHTML = `
      <div class="pagehead"><div><h1>${hi}, Rafael</h1><p class="mut" style="margin-top:2px">${esc(data)}</p></div><span class="sp"></span>
        <button class="btn ghost" id="iTarefa">+ Tarefa</button><button class="btn orange" id="iLanc">+ Lançamento</button></div>

      <section class="ini-hero" aria-label="Resumo financeiro">
        <a class="ini-main" href="#/patrimonio"><span class="l">Patrimônio líquido</span><span class="v">${brl(pat.net)}</span><span class="s">contas, investimentos e bens, menos dívidas</span></a>
        <a class="ini-st" href="#/financas/painel"><span class="l">Saldo em contas</span><span class="v">${brl(saldo)}</span></a>
        <a class="ini-st" href="#/financas/relatorios"><span class="l">Resultado de ${monthLabel(mk)}</span><span class="v ${res >= 0 ? "pos" : "neg"}">${res >= 0 ? "+" : "−"}${brl(Math.abs(res))}</span></a>
        <a class="ini-st" href="#/investimentos"><span class="l">Investimentos no exterior</span><span class="v">${usd(inv.mvUSD + inv.cashUSD)}</span><span class="s">${brl(inv.totalBRL)}</span></a>
      </section>

      <div class="grid2 ini-cols">
        <div class="card">
          <div class="card-h"><h3>A pagar em 30 dias</h3><span class="mut">${bills.length ? brl(totBills) : ""}</span></div>
          ${venc.length ? `<a class="note err" href="#/financas/agenda" style="text-decoration:none;margin-bottom:10px">${venc.length} conta${venc.length > 1 ? "s" : ""} vencida${venc.length > 1 ? "s" : ""}, ${brl(venc.reduce((s, b) => s + b.amount, 0))}</a>` : ""}
          ${bills.length ? `<div class="ini-list">${bills.slice(0, 8).map((b) => `<a class="ini-row" href="#/financas/agenda"><span class="d ${b.due < hoje ? "neg" : ""}">${fdate(b.due).slice(0, 5)}</span><span class="n">${esc(b.desc)}</span><span class="v">${brl(b.amount)}</span></a>`).join("")}</div>${bills.length > 8 ? `<a class="ini-more" href="#/financas/agenda">Ver as ${bills.length} contas</a>` : ""}` : `<div class="empty">Nenhuma conta nos próximos 30 dias.</div>`}
        </div>
        <div class="card">
          <div class="card-h"><h3>Tarefas para hoje</h3><span class="mut">${abertas} em aberto</span></div>
          ${due.length ? `<div class="ini-list">${due.slice(0, 8).map((t) => { const l = ERP.reminders.listOf(t.listId); return `<a class="ini-row" href="#/reminders"><span class="ini-ck"></span><span class="n">${esc(t.title)}${l ? `<small class="mut">${esc(l.name)}</small>` : ""}</span><span class="pill ${t.due < hoje ? "err" : "warn"}">${t.due < hoje ? "atrasada" : "hoje"}</span></a>`; }).join("")}</div>` : `<div class="empty">Nada para hoje.<br><a href="#/reminders">Ver todas as tarefas</a></div>`}
        </div>
      </div>`;
    $("#iLanc", root).onclick = () => ERP.finUI.lancForm();
    $("#iTarefa", root).onclick = () => ERP.nav("reminders");
  }
  ERP.register({ id: "inicio", label: "Início", icon: "house", group: "Geral", render });
})();

</script>
<script>/* js/mod-reminders.js */
/* Módulo Reminders — Central de Demandas (listas, prazos, checklist, visão Lista e Kanban) */
(function () {
  "use strict";
  const { $, $$, esc, uid, todayISO, fdate, Store } = ERP;
  ERP.defaults.reminders = { lists: [], tasks: [], seq: 0 };

  const ST = [["todo", "A fazer"], ["doing", "Em andamento"], ["wait", "Aguardando"], ["block", "Bloqueado"], ["done", "Concluído"]];
  const STN = Object.fromEntries(ST);
  const PR = [["none", "Sem prioridade"], ["low", "Baixa"], ["med", "Média"], ["high", "Alta"]];
  const PRN = Object.fromEntries(PR);
  const BIC = { hoje: "calendar", agendadas: "calendar-clock", todas: "list", sinal: "flag", andamento: "clock", concluidas: "circle-check" };
  const BLOCKS = [["hoje", "Hoje"], ["agendadas", "Agendadas"], ["todas", "Todas"], ["sinal", "Sinalizadas"], ["andamento", "Em andamento"], ["concluidas", "Concluídas"]];
  const COLORS = ["#b94ee0", "#f1612f", "#2b5ba8", "#197a46", "#c9a100", "#d6336c", "#0b1628", "#5b6068"];
  const S = { sel: "todas", view: "lista", q: "" };

  const D = () => Store.get("reminders");
  const open = (t) => t.status !== "done";
  const filt = (t) => {
    const s = S.sel, today = todayISO();
    if (s === "hoje") return open(t) && t.due && t.due <= today;
    if (s === "agendadas") return open(t) && !!t.due;
    if (s === "todas") return open(t);
    if (s === "sinal") return open(t) && t.flagged;
    if (s === "andamento") return t.status === "doing";
    if (s === "concluidas") return t.status === "done";
    return t.listId === s && (S.view === "kanban" || open(t));
  };
  const count = (id) => { const old = S.sel; S.sel = id; const n = D().tasks.filter((t) => filt(t) && (!["todas"].includes(id) || true)).length; S.sel = old; return n; };

  function parseQuick(txt) {
    let title = txt, owner = "", priority = "none", due = "", tags = [];
    title = title.replace(/@(\S+)/g, (m, a) => { owner = a; return ""; });
    title = title.replace(/!(alta|media|média|baixa)/gi, (m, a) => { a = a.toLowerCase(); priority = a === "alta" ? "high" : a === "baixa" ? "low" : "med"; return ""; });
    title = title.replace(/#(\S+)/g, (m, a) => { tags.push(a); return ""; });
    title = title.replace(/\b(hoje|amanh[ãa])\b/gi, (m, a) => { const d = new Date(); if (/amanh/i.test(a)) d.setDate(d.getDate() + 1); due = d.getFullYear() + "-" + ERP.p2(d.getMonth() + 1) + "-" + ERP.p2(d.getDate()); return ""; });
    title = title.replace(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, (m, d, mo, y) => { const yy = y ? (y.length === 2 ? "20" + y : y) : String(new Date().getFullYear()); due = yy + "-" + ERP.p2(mo) + "-" + ERP.p2(d); return ""; });
    return { title: title.replace(/\s+/g, " ").trim(), owner, priority, due, tags };
  }

  function addTask(txt) {
    const p = parseQuick(txt); if (!p.title) return;
    const sel = S.sel; const lid = D().lists.some((l) => l.id === sel) ? sel : (D().lists[0] || {}).id || "";
    Store.change("reminders", (d) => {
      d.seq = Math.max(d.seq || 0, ...d.tasks.map((t) => t.num || 0)) + 1;
      const now = Date.now();
      d.tasks.push({ id: uid("t"), num: d.seq, key: "DEM-" + String(d.seq).padStart(2, "0"), title: p.title, notes: "", listId: lid, status: "todo", priority: p.priority, due: p.due, time: "", owner: p.owner, tags: p.tags, subtasks: [], flagged: false, order: d.seq, createdAt: now, updatedAt: now, doneAt: null });
    });
    ERP.render();
  }
  function setStatus(id, status) {
    Store.change("reminders", (d) => { const t = d.tasks.find((x) => x.id === id); if (!t) return; t.status = status; t.updatedAt = Date.now(); t.doneAt = status === "done" ? Date.now() : null; });
  }

  function editTask(id) {
    const d = D(); const t = d.tasks.find((x) => x.id === id); if (!t) return;
    const subs = (t.subtasks || []).map((s) => (s.done ? "[x] " : "[ ] ") + s.t).join("\n");
    ERP.form({
      title: `${t.key} · Editar demanda`, wide: true,
      fields: [
        { k: "title", label: "Título", value: t.title, full: true, required: true },
        { k: "listId", label: "Lista", type: "select", value: t.listId, options: d.lists.map((l) => [l.id, l.name]) },
        { k: "status", label: "Status", type: "select", value: t.status, options: ST },
        { k: "priority", label: "Prioridade", type: "select", value: t.priority, options: PR },
        { k: "owner", label: "Responsável", value: t.owner },
        { k: "due", label: "Prazo", type: "date", value: t.due },
        { k: "time", label: "Horário", type: "time", value: t.time },
        { k: "tags", label: "Etiquetas (separadas por vírgula)", value: (t.tags || []).join(", "), full: true },
        { k: "notes", label: "Anotações", type: "textarea", value: t.notes, full: true },
        { k: "subs", label: "Checklist (uma etapa por linha; [x] marca como feita)", type: "textarea", value: subs, full: true },
        { k: "flagged", label: "Sinalizada", type: "checkbox", value: t.flagged },
      ],
      onSubmit(v) {
        Store.change("reminders", (dd) => {
          const x = dd.tasks.find((y) => y.id === id); if (!x) return;
          Object.assign(x, { title: v.title.trim(), listId: v.listId, priority: v.priority, owner: v.owner.trim(), due: v.due, time: v.time, notes: v.notes, flagged: v.flagged, updatedAt: Date.now() });
          x.tags = v.tags.split(",").map((s) => s.trim()).filter(Boolean);
          x.subtasks = v.subs.split("\n").map((l) => l.trim()).filter(Boolean).map((l, i) => ({ id: "s" + (i + 1), done: /^\[x\]/i.test(l), t: l.replace(/^\[[ xX]\]\s*/, "") }));
          if (v.status !== x.status) { x.status = v.status; x.doneAt = v.status === "done" ? Date.now() : null; }
        });
        ERP.render();
      },
      onDelete() { Store.change("reminders", (dd) => { dd.tasks = dd.tasks.filter((x) => x.id !== id); }); ERP.render(); },
    });
  }
  function editList(id) {
    const d = D(); const l = d.lists.find((x) => x.id === id) || { name: "", color: COLORS[0] };
    ERP.form({
      title: id ? "Editar lista" : "Nova lista",
      fields: [
        { k: "name", label: "Nome", value: l.name, required: true },
        { k: "color", label: "Cor", type: "select", value: l.color, options: COLORS.map((c) => [c, c]) },
      ],
      onSubmit(v) {
        Store.change("reminders", (dd) => {
          if (id) Object.assign(dd.lists.find((x) => x.id === id), { name: v.name.trim(), color: v.color });
          else dd.lists.push({ id: uid("l"), name: v.name.trim(), color: v.color, order: dd.lists.length + 1 });
        });
        ERP.render();
      },
      onDelete: id ? () => { Store.change("reminders", (dd) => { dd.lists = dd.lists.filter((x) => x.id !== id); dd.tasks.forEach((t) => { if (t.listId === id) t.listId = ""; }); }); S.sel = "todas"; ERP.render(); } : null,
    });
  }

  function dueMeta(t) {
    if (!t.due) return "";
    const late = open(t) && t.due < todayISO();
    return `<span class="pill ${late ? "err" : t.due === todayISO() ? "warn" : ""}">${fdate(t.due)}${t.time ? " " + t.time : ""}</span>`;
  }

  function render(root) {
    const d = D();
    const lists = d.lists.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const listBy = Object.fromEntries(lists.map((l) => [l.id, l]));
    root.innerHTML = ERP.pagehead("Reminders", `<button class="btn ghost" id="rNewList">+ Lista</button>`) + `
      <div class="rem"><aside class="rem-side">
        <div class="smart">${BLOCKS.map(([id, n]) => `<button class="lst ${S.sel === id ? "on" : ""}" data-sel="${id}">${ERP.ic(BIC[id], 17)}${n}<span class="ct">${count(id)}</span></button>`).join("")}</div>
        <h4 class="rem-h">Listas</h4>
        ${lists.map((l) => `<button class="lst ${S.sel === l.id ? "on" : ""}" data-sel="${l.id}"><span class="dot" style="background:${esc(l.color)}"></span>${esc(l.name)}<span class="ct">${d.tasks.filter((t) => t.listId === l.id && open(t)).length}</span></button>`).join("")}
        ${S.sel && listBy[S.sel] ? `<button class="btn ghost sm" style="margin-top:8px" data-editlist="${S.sel}">Editar lista</button>` : ""}
      </aside><section>
        <div class="quick"><input id="rQuick" placeholder="Nova tarefa, ex.: Renovar passaporte @Rafael 10/06 !alta #documentos" aria-label="Nova tarefa"><button class="btn orange" id="rAdd">Adicionar</button></div>
        <div class="toolbar"><div class="tabs" style="margin:0"><button class="${S.view === "lista" ? "on" : ""}" data-view="lista">Lista</button><button class="${S.view === "kanban" ? "on" : ""}" data-view="kanban">Kanban</button></div><input id="rQ" placeholder="Buscar" value="${esc(S.q)}" style="max-width:220px"></div>
        <div id="rBody"></div></section></div>`;
    const q = S.q.trim().toLowerCase();
    const tasks = d.tasks.filter(filt).filter((t) => !q || (t.title + " " + (t.notes || "") + " " + (t.tags || []).join(" ")).toLowerCase().includes(q)).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (a.order || 0) - (b.order || 0));
    const body = $("#rBody", root);
    /* tarefas automáticas (como na Central de Tarefas do ERP Nova Macabu): contas de Finanças vencidas ou a vencer em 7 dias */
    const autos = ERP.fin && ["hoje", "agendadas", "todas"].includes(S.sel) ? ERP.fin.pendencias().filter((p) => p.tipo !== "receita" && p.data <= ERP.fin.addDias(todayISO(), S.sel === "hoje" ? 0 : 7)) : [];
    const autoHtml = autos.length ? `<div class="tw" style="margin-bottom:12px">${autos.map((p) => `<a class="trow" href="#/financas/agenda" style="text-decoration:none;color:inherit"><span class="ck" style="border-style:dashed" aria-hidden="true"></span><div class="tt">⚡ Pagar: ${esc(p.desc)}<div class="meta"><span>Finanças</span><span class="pill ${p.data < todayISO() ? "err" : p.data === todayISO() ? "warn" : ""}">${fdate(p.data)}</span><span>${ERP.brl(p.valor)}</span><span>automática</span></div></div></a>`).join("")}</div>` : "";
    if (S.view === "lista") {
      body.innerHTML = autoHtml + (tasks.length ? `<div class="tw">${tasks.map((t) => {
        const l = listBy[t.listId]; const sub = (t.subtasks || []);
        return `<div class="trow ${t.status === "done" ? "done" : ""}"><button class="ck" data-ck="${t.id}" aria-label="Concluir"></button><div class="tt" data-edit="${t.id}">${t.flagged ? "🚩 " : ""}${esc(t.title)}<div class="meta">${l ? `<span class="cat"><i style="background:${esc(l.color)}"></i>${esc(l.name)}</span>` : ""}${dueMeta(t)}${t.priority !== "none" ? `<span class="pill ${t.priority === "high" ? "err" : t.priority === "med" ? "warn" : ""}">${PRN[t.priority]}</span>` : ""}${t.status !== "todo" && t.status !== "done" ? `<span class="pill info">${STN[t.status]}</span>` : ""}${sub.length ? `<span>☑ ${sub.filter((s) => s.done).length}/${sub.length}</span>` : ""}${t.owner ? `<span>@${esc(t.owner)}</span>` : ""}${(t.tags || []).map((g) => `<span>#${esc(g)}</span>`).join("")}</div></div></div>`;
      }).join("")}</div>` : `<div class="empty">Nenhuma tarefa aqui. Escreva acima e tecle Enter.</div>`);
    } else {
      body.innerHTML = `<div class="kan">${ST.map(([k, n]) => `<div class="kcol" data-col="${k}"><h4>${n} · ${tasks.filter((t) => t.status === k).length}</h4>${tasks.filter((t) => t.status === k).map((t) => `<div class="kcard" draggable="true" data-id="${t.id}" data-edit="${t.id}">${esc(t.title)}<div class="meta mut">${listBy[t.listId] ? esc(listBy[t.listId].name) : ""} ${dueMeta(t)}</div></div>`).join("")}</div>`).join("")}</div>`;
      $$(".kcard", body).forEach((c) => c.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", c.dataset.id)));
      $$(".kcol", body).forEach((c) => {
        c.addEventListener("dragover", (e) => { e.preventDefault(); c.classList.add("over"); });
        c.addEventListener("dragleave", () => c.classList.remove("over"));
        c.addEventListener("drop", (e) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) { setStatus(id, c.dataset.col); ERP.render(); } });
      });
    }
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-sel],[data-view],[data-ck],[data-edit],[data-editlist]"); if (!b) return;
      if (b.dataset.sel) { S.sel = b.dataset.sel; ERP.render(); }
      else if (b.dataset.view) { S.view = b.dataset.view; ERP.render(); }
      else if (b.dataset.ck) { const t = D().tasks.find((x) => x.id === b.dataset.ck); setStatus(t.id, t.status === "done" ? "todo" : "done"); ERP.render(); }
      else if (b.dataset.edit) editTask(b.dataset.edit);
      else if (b.dataset.editlist) editList(b.dataset.editlist);
    });
    $("#rNewList", root).onclick = () => editList(null);
    $("#rAdd", root).onclick = () => { const i = $("#rQuick", root); addTask(i.value); };
    $("#rQuick", root).onkeydown = (e) => { if (e.key === "Enter") addTask(e.target.value); };
    $("#rQ", root).oninput = (e) => { S.q = e.target.value; const p = e.target.selectionStart; ERP.render(); const n = $("#rQ"); n.focus(); n.setSelectionRange(p, p); };
  }

  ERP.reminders = { openCount: () => D().tasks.filter(open).length, dueToday: () => D().tasks.filter((t) => open(t) && t.due && t.due <= todayISO()), listOf: (id) => D().lists.find((l) => l.id === id) };
  ERP.register({ id: "reminders", label: "Reminders", icon: "list-checks", group: "Organização", render });
})();

</script>
<script>/* js/fin-modelo.js */
/* Finanças Pessoais — modelo de dados e cálculos (sem tela).
   Ideias trazidas do Piloto 3.0 (regimes caixa × competência, faturas pelo fechamento, dívidas com plano, aposentadoria)
   e do ERP Nova Macabu (plano de contas que alimenta a DRE, natureza do gasto, situação da conta com histórico e estorno,
   juros/desconto no pagamento, fechamento do mês com trava, fluxo de caixa projetado, indicadores). */
(function () {
  "use strict";
  const { uid, todayISO, monthKey, addMonths, p2, Store } = ERP;

  /* ---------- plano de contas pessoal ----------
     natureza: essencial (necessidades) · estilo (estilo de vida) · financeiro (juros, tarifas, dívidas) · investimento (destinação, fora do resultado)
     fixo: true = se repete todo mês com valor estável */
  const PLANO = [
    ["Receitas", "receita", null, [["Salário / pró-labore", 1], ["Distribuição de lucros", 0], ["Renda extra / freelance", 0], ["Rendimentos financeiros", 0], ["Aluguéis recebidos", 1], ["Reembolsos", 0], ["Outras receitas", 0]]],
    ["Moradia", "despesa", "essencial", [["Aluguel / financiamento", 1], ["Condomínio", 1], ["IPTU", 1], ["Energia", 1], ["Água", 1], ["Gás", 1], ["Internet e telefone", 1], ["Manutenção da casa", 0]]],
    ["Alimentação", "despesa", "essencial", [["Mercado", 0], ["Feira e padaria", 0]]],
    ["Transporte", "despesa", "essencial", [["Combustível", 0], ["Estacionamento e pedágio", 0], ["Aplicativo / táxi", 0], ["Seguro, IPVA e licenciamento", 1], ["Manutenção do veículo", 0]]],
    ["Saúde", "despesa", "essencial", [["Plano de saúde", 1], ["Farmácia", 0], ["Consultas e exames", 0]]],
    ["Educação", "despesa", "essencial", [["Cursos e faculdade", 1], ["Livros e material", 0]]],
    ["Família e pets", "despesa", "essencial", [["Pets", 0], ["Família", 0]]],
    ["Estilo de vida", "despesa", "estilo", [["Restaurantes e delivery", 0], ["Lazer", 0], ["Viagens", 0], ["Assinaturas e streaming", 1], ["Vestuário", 0], ["Cuidados pessoais", 0], ["Academia e esporte", 1], ["Presentes", 0], ["Compras diversas", 0]]],
    ["Impostos", "despesa", "essencial", [["Imposto de renda", 0], ["Outros impostos e taxas", 0]]],
    ["Financeiro", "despesa", "financeiro", [["Juros e multas", 0], ["Tarifas bancárias", 1], ["Cheque especial e IOF", 0], ["Parcelas de dívidas", 1]]],
    ["Investimentos e reservas", "despesa", "investimento", [["Aportes em investimentos", 1], ["Reserva de emergência", 1], ["Previdência", 1]]],
    ["Doações", "despesa", "estilo", [["Doações e dízimo", 0]]],
    ["Investimentos e reservas", "receita", "investimento", [["Resgates de investimentos", 0]]],   /* resgate: volta para a conta sem ser receita do mês */
  ];
  const CORES = { Receitas: "#197A46", Moradia: "#0E5E6F", "Alimentação": "#C2643B", Transporte: "#3F6DB3", "Saúde": "#B44B6E", "Educação": "#3A8F7E", "Família e pets": "#A0703C", "Estilo de vida": "#8A63C2", Impostos: "#7A7A7A", Financeiro: "#B3271E", "Investimentos e reservas": "#0B1628", "Doações": "#5E7C8D" };
  function planoPadrao() {
    const cats = []; let i = 0;
    PLANO.forEach(([grupo, tipo, nat, itens]) => itens.forEach(([nome, fixo]) => cats.push({ id: "c" + (++i), nome, grupo, tipo, natureza: tipo === "receita" ? (nat || "receita") : nat, fixo: !!fixo, cor: CORES[grupo] || "#5B6068", ativa: true })));
    return cats;
  }
  const NAT = { receita: "Receita", essencial: "Necessidades", estilo: "Estilo de vida", financeiro: "Financeiro", investimento: "Investimentos e reservas" };
  const DIVIDA_CAT = "c" + (PLANO.slice(0, 10).reduce((s, g) => s + g[3].length, 0)); /* "Parcelas de dívidas" */

  ERP.defaults.financas = {
    schema: 1,
    cfg: { reservaMeses: 6, regime: "caixa", idade: 40, idadeApos: 60, rendaDesejada: 15000, retornoReal: 4, aporteApos: 2000, alertaCartao: 80 },
    contas: [{ id: "ct_principal", nome: "Conta principal", tipo: "corrente", banco: "", saldoIni: 0, dataIni: todayISO(), limite: 0, jurosCheque: 8, ativa: true }],
    cartoes: [], categorias: planoPadrao(), lanc: [], series: [], dividas: [], orcamento: { padrao: {}, meses: {} }, metas: [], fechados: {},
  };
  const D = () => Store.get("financas");

  /* ---------- utilitários de data ---------- */
  const hoje = () => todayISO();
  const addDias = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const t = new Date(y, m - 1, d + n); return t.getFullYear() + "-" + p2(t.getMonth() + 1) + "-" + p2(t.getDate()); };
  const diaNoMes = (mk, dia) => { const [y, m] = mk.split("-").map(Number); return mk + "-" + p2(Math.min(+dia || 1, new Date(y, m, 0).getDate())); };
  const mesSeg = (mk, n) => monthKey(addMonths(mk + "-01", n));
  const diasEntre = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
  const r2 = (v) => Math.round((+v || 0) * 100) / 100;

  /* ---------- consultas ---------- */
  const cat = (id) => D().categorias.find((c) => c.id === id) || { nome: "Sem categoria", grupo: "—", natureza: "estilo", cor: "#9AA5B1", tipo: "despesa" };
  const conta = (id) => D().contas.find((c) => c.id === id);
  const cartao = (id) => D().cartoes.find((c) => c.id === id);

  /* fatura de uma compra: fecha no dia "fecha"; compra no dia do fechamento ou depois vai para a fatura seguinte (Piloto 3.0) */
  function faturaDe(c, iso) {
    const [y, m, d] = iso.split("-").map(Number); let mk = y + "-" + p2(m);
    if (d >= (+c.fecha || 1)) mk = mesSeg(mk, 1);
    const fecha = diaNoMes(mk, c.fecha);
    const vmk = (+c.vence || 10) <= (+c.fecha || 1) ? mesSeg(mk, 1) : mk;
    return { key: mk, fecha, vence: diaNoMes(vmk, c.vence) };
  }
  /* situação de um lançamento (a mesma linguagem da CAP) */
  function situacao(l) {
    if (l.tipo === "compra") return { k: "cartao", n: "No cartão", cls: "info" };
    if (l.tipo === "estorno") return { k: "cartao", n: "Estorno no cartão", cls: "ok" };
    if (l.tipo === "ajuste") return { k: "pago", n: "Ajuste", cls: "" };
    if (l.pago) return { k: "pago", n: l.tipo === "receita" ? "Recebido" : "Pago", cls: "ok" };
    const h = hoje();
    if (l.venc < h) return { k: "vencido", n: "Vencido", cls: "err" };
    if (l.venc === h) return { k: "hoje", n: "Vence hoje", cls: "warn" };
    if (l.venc <= addDias(h, 7)) return { k: "semana", n: "Em " + diasEntre(h, l.venc) + " dia(s)", cls: "warn" };
    return { k: "previsto", n: "Previsto", cls: "" };
  }
  /* data do lançamento em cada regime */
  const dataCaixa = (l) => l.pago || l.venc;
  const dataComp = (l) => l.comp || l.venc;
  const naDRE = (l) => l.tipo === "receita" || l.tipo === "despesa" || l.tipo === "compra" || l.tipo === "estorno";

  /* faturas de um cartão */
  function faturas(cid) {
    const d = D(); const c = cartao(cid); if (!c) return [];
    const map = {};
    d.lanc.forEach((l) => {
      if (l.cartaoId !== cid || (l.tipo !== "compra" && l.tipo !== "estorno")) return;
      const k = l.fatura; const f = (map[k] = map[k] || Object.assign(faturaPorChave(c, k), { itens: [], total: 0 }));
      f.itens.push(l); f.total += l.tipo === "estorno" ? -l.valor : l.valor;
    });
    d.lanc.forEach((l) => { if (l.tipo === "pagfatura" && l.cartaoId === cid && !map[l.fatura]) map[l.fatura] = Object.assign(faturaPorChave(c, l.fatura), { itens: [], total: 0 }); });
    const h = hoje();
    return Object.values(map).map((f) => {
      f.total = r2(f.total);
      f.pagto = d.lanc.find((l) => l.tipo === "pagfatura" && l.cartaoId === cid && l.fatura === f.key) || null;
      f.status = f.pagto && f.pagto.pago ? "paga" : f.vence < h ? "vencida" : h >= f.fecha ? "fechada" : "aberta";
      f.itens.sort((a, b) => b.comp.localeCompare(a.comp));
      return f;
    }).sort((a, b) => b.key.localeCompare(a.key));
  }
  function faturaPorChave(c, mk) { const vmk = (+c.vence || 10) <= (+c.fecha || 1) ? mesSeg(mk, 1) : mk; return { key: mk, fecha: diaNoMes(mk, c.fecha), vence: diaNoMes(vmk, c.vence), cartaoId: c.id }; }
  const faturasAbertas = () => D().cartoes.flatMap((c) => faturas(c.id).filter((f) => f.status !== "paga" && f.total > 0.004).map((f) => Object.assign({ cartao: c }, f)));
  const usoCartao = (cid) => faturas(cid).filter((f) => f.status !== "paga").reduce((s, f) => s + f.total, 0);

  /* saldo de uma conta numa data (inclusive) — só o que foi pago/recebido */
  function saldoConta(id, ate) {
    const c = conta(id); if (!c) return 0; ate = ate || hoje(); let s = +c.saldoIni || 0;
    D().lanc.forEach((l) => {
      if (!l.pago || l.pago > ate || l.pago < (c.dataIni || "0000")) return;
      if (l.tipo === "transferencia") { if (l.contaId === id) s -= l.valor; if (l.paraId === id) s += l.valor; return; }
      if (l.tipo === "ajuste") { if (l.contaId === id) s += l.valor; return; }   /* conferência com o extrato (valor com sinal) */
      if (l.contaId !== id) return;
      const v = l.valorPago != null ? l.valorPago : l.valor;
      if (l.tipo === "receita") s += v; else if (l.tipo === "despesa" || l.tipo === "pagfatura") s -= v;
    });
    return r2(s);
  }
  const contasAtivas = () => D().contas.filter((c) => c.ativa !== false);
  const saldoTotal = () => contasAtivas().filter((c) => c.tipo !== "reserva").reduce((s, c) => s + saldoConta(c.id), 0);
  const saldoReservas = () => contasAtivas().filter((c) => c.tipo === "reserva").reduce((s, c) => s + saldoConta(c.id), 0);

  /* resultado de um mês (DRE pessoal), no regime pedido */
  function dreMes(mk, regime) {
    regime = regime || D().cfg.regime;
    const r = { rec: 0, essencial: 0, estilo: 0, financeiro: 0, investimento: 0, fixo: 0, variavel: 0, cartao: 0, porCat: {}, porCatRec: {}, n: 0, nE: 0, nS: 0 };
    const cls = (l, c, v, noCartao) => { if (c.natureza === "investimento") return; const k = noCartao ? "cartao" : (l.classe || (c.fixo ? "fixo" : "variavel")); r[k] += v; };
    D().lanc.forEach((l) => {
      if (!naDRE(l)) return;
      if (regime === "caixa" && (l.tipo === "compra" || l.tipo === "estorno")) return;   /* no caixa, o cartão entra pelo pagamento da fatura */
      if (regime === "caixa" && !l.pago) return;
      const dt = regime === "caixa" ? dataCaixa(l) : dataComp(l);
      if (monthKey(dt) !== mk) return;
      const c = cat(l.catId); const v = l.tipo === "estorno" ? -l.valor : (l.valorPago != null && regime === "caixa" ? l.valorPago : l.valor);
      r.n++;
      if (l.tipo === "receita") { if (c.natureza === "investimento") { r.investimento -= v; return; } r.rec += v; r.nE++; r.porCatRec[l.catId] = (r.porCatRec[l.catId] || 0) + v; return; }
      r.nS++; r[c.natureza] = (r[c.natureza] || 0) + v; r.porCat[l.catId] = (r.porCat[l.catId] || 0) + v;
      cls(l, c, v, l.tipo === "compra" || l.tipo === "estorno");
    });
    if (regime === "caixa") {   /* pagamento de fatura: despesa de cartão no caixa, rateada pelas categorias das compras */
      D().lanc.forEach((l) => {
        if (l.tipo !== "pagfatura" || !l.pago || monthKey(l.pago) !== mk) return;
        const f = faturas(l.cartaoId).find((x) => x.key === l.fatura); const pago = l.valorPago != null ? l.valorPago : l.valor;
        const base = f && f.total > 0 ? f.itens : []; r.n++; r.nS++;
        if (!base.length) { r.estilo += pago; r.cartao += pago; return; }
        const fator = pago / f.total;
        base.forEach((it) => { const c = cat(it.catId); const v = (it.tipo === "estorno" ? -it.valor : it.valor) * fator; r[c.natureza] = (r[c.natureza] || 0) + v; r.porCat[it.catId] = (r.porCat[it.catId] || 0) + v; cls(it, c, v, true); });
      });
    }
    r.consumo = r.essencial + r.estilo;
    r.operacional = r.rec - r.consumo;
    r.resultado = r.operacional - r.financeiro;
    r.livre = r.resultado - r.investimento;
    r.despesas = r.consumo + r.financeiro;
    r.poupanca = r.rec > 0 ? (r.investimento + Math.max(0, r.livre)) / r.rec * 100 : 0;
    return r;
  }

  /* soma de vários meses (ano todo ou janela) */
  function drePeriodo(mks, regime) {
    const t = { porCat: {}, porCatRec: {} }; const nums = ["rec", "essencial", "estilo", "financeiro", "investimento", "fixo", "variavel", "cartao", "n", "nE", "nS", "consumo", "operacional", "resultado", "livre", "despesas"];
    nums.forEach((k) => (t[k] = 0));
    mks.forEach((mk) => { const r = dreMes(mk, regime); nums.forEach((k) => (t[k] += r[k] || 0)); ["porCat", "porCatRec"].forEach((g) => Object.entries(r[g]).forEach(([k, v]) => (t[g][k] = (t[g][k] || 0) + v))); });
    t.poupanca = t.rec > 0 ? (t.investimento + Math.max(0, t.livre)) / t.rec * 100 : 0;
    return t;
  }
  /* saldo das contas do dia a dia numa data (sem as reservas) — base do gráfico de desempenho */
  const saldoEm = (dt) => contasAtivas().filter((c) => c.tipo !== "reserva").reduce((s, c) => s + saldoConta(c.id, dt), 0);
  function historicoSaldo(ini) {
    const h = hoje(); const ids = new Set(contasAtivas().filter((c) => c.tipo !== "reserva").map((c) => c.id));
    const datas = [...new Set(D().lanc.filter((l) => l.pago && l.pago > ini && l.pago <= h && (ids.has(l.contaId) || ids.has(l.paraId))).map((l) => l.pago))].sort();
    return [ini].concat(datas).concat(datas[datas.length - 1] === h || ini === h ? [] : [h]).map((d) => ({ d, v: r2(saldoEm(d)) }));
  }

  /* pendências (contas a pagar e a receber) + faturas */
  function pendencias() {
    const itens = D().lanc.filter((l) => !l.pago && (l.tipo === "receita" || l.tipo === "despesa" || l.tipo === "transferencia")).map((l) => ({ k: "l", l, data: l.venc, valor: l.valor, desc: l.desc, tipo: l.tipo }));
    faturasAbertas().forEach((f) => { if (f.pagto && f.pagto.pago) return; itens.push({ k: "f", f, data: f.vence, valor: f.total, desc: "Fatura " + f.cartao.nome + " · " + ERP.monthLabel(f.key), tipo: "despesa" }); });
    return itens.sort((a, b) => a.data.localeCompare(b.data));
  }

  /* fluxo de caixa projetado: saldo de hoje + pendências por data (atrasadas contam hoje) */
  function projecao(meses) {
    meses = meses || 12; const h = hoje(); const ini = saldoTotal(); const fim = diaNoMes(mesSeg(monthKey(h), meses - 1), 31);
    const ev = pendencias().map((p) => {
      let v = p.tipo === "receita" ? p.valor : -p.valor;
      if (p.k === "l" && p.l.tipo === "transferencia") { const de = conta(p.l.contaId), para = conta(p.l.paraId); v = 0; if (de && de.tipo !== "reserva") v -= p.valor; if (para && para.tipo !== "reserva") v += p.valor; }
      return { data: p.data < h ? h : p.data, v, desc: p.desc };
    }).filter((e) => e.data <= fim).sort((a, b) => a.data.localeCompare(b.data));
    const porMes = []; let s = ini, min = { v: ini, data: h };
    for (let i = 0; i < meses; i++) {
      const mk = mesSeg(monthKey(h), i); const es = ev.filter((e) => monthKey(e.data) === mk);
      const ent = es.filter((e) => e.v > 0).reduce((a, e) => a + e.v, 0), sai = -es.filter((e) => e.v < 0).reduce((a, e) => a + e.v, 0);
      es.forEach((e) => { s += e.v; if (s < min.v) min = { v: s, data: e.data }; });
      porMes.push({ mk, ent, sai, saldo: s });
    }
    /* juros estimados do cheque especial: saldo negativo médio do mês × taxa */
    const jurosAm = (contasAtivas()[0] || {}).jurosCheque || 0;
    porMes.forEach((m) => { m.juros = m.saldo < 0 ? -m.saldo * jurosAm / 100 : 0; });
    return { ini, porMes, min, ev };
  }

  /* orçamento do mês por categoria */
  const orcado = (mk, cid) => { const o = D().orcamento; const m = o.meses[mk] || {}; return m[cid] != null ? +m[cid] : +(o.padrao[cid] || 0); };
  function orcamentoMes(mk) {
    const real = dreMes(mk, "competencia"); const d = D();
    const prev = {}; d.lanc.forEach((l) => { if (!l.pago && l.tipo === "despesa" && monthKey(l.venc) === mk) prev[l.catId] = (prev[l.catId] || 0) + l.valor; });
    return d.categorias.filter((c) => c.tipo === "despesa" && c.ativa !== false).map((c) => {
      const o = orcado(mk, c.id), r = real.porCat[c.id] || 0, p = prev[c.id] || 0;   /* previstos já entram na competência; "p" mostra o que falta pagar */
      return { c, orcado: o, realizado: r, pendente: p, pct: o > 0 ? r / o * 100 : (r > 0 ? 999 : 0) };
    }).filter((x) => x.orcado > 0 || x.realizado > 0);
  }

  /* média mensal das despesas essenciais (últimos 6 meses fechados, competência) — base da reserva de emergência */
  function mediaEssencial(n) {
    n = n || 6; let s = 0, k = 0; const mk = monthKey(hoje());
    for (let i = 1; i <= n; i++) { const r = dreMes(mesSeg(mk, -i), "competencia"); if (r.n) { s += r.essencial + r.financeiro; k++; } }
    if (!k) { const r = dreMes(mk, "competencia"); return r.essencial + r.financeiro; }
    return s / k;
  }

  /* ---------- dívidas ---------- */
  function dividaInfo(dv) {
    const ls = D().lanc.filter((l) => l.dividaId === dv.id && l.tipo === "despesa");
    const abertas = ls.filter((l) => !l.pago).sort((a, b) => a.venc.localeCompare(b.venc)), pagas = ls.filter((l) => l.pago);
    const i = (+dv.taxa || 0) / 100;
    const nominal = abertas.reduce((s, l) => s + l.valor, 0);
    const saldo = i > 0 ? abertas.reduce((s, l, k) => s + l.valor / Math.pow(1 + i, k + 1), 0) : nominal;   /* valor presente das parcelas */
    return { abertas, pagas, rest: abertas.length, nominal: r2(nominal), saldo: r2(saldo), juros: r2(nominal - saldo), proxima: abertas[0] || null, ultima: abertas[abertas.length - 1] || null, atraso: abertas.filter((l) => l.venc < hoje()).length };
  }
  /* simulação: pagar o mínimo de todas + um extra mensal na dívida da vez (avalanche = maior juros; bola de neve = menor saldo) */
  function simularDividas(extra, metodo) {
    const ds = D().dividas.map((dv) => { const inf = dividaInfo(dv); return { id: dv.id, nome: dv.nome, saldo: inf.saldo, taxa: (+dv.taxa || 0) / 100, parcela: inf.proxima ? inf.proxima.valor : 0, prio: { Alta: 0, "Média": 1, Baixa: 2 }[dv.prioridade] ?? 1 }; }).filter((x) => x.saldo > 0.01 && x.parcela > 0);
    let mes = 0, juros = 0; const quit = {};
    const ordem = () => ds.filter((x) => x.saldo > 0.01).sort((a, b) => metodo === "neve" ? a.saldo - b.saldo : metodo === "prioridade" ? a.prio - b.prio || a.saldo - b.saldo : b.taxa - a.taxa || a.saldo - b.saldo);
    while (ds.some((x) => x.saldo > 0.01) && mes < 600) {
      mes++; let sobra = +extra || 0;
      ds.forEach((x) => { if (x.saldo <= 0.01) return; const j = x.saldo * x.taxa; juros += j; x.saldo += j; const pg = Math.min(x.parcela, x.saldo); x.saldo -= pg; if (x.saldo <= 0.01) { sobra += x.parcela - pg; } });
      for (const x of ordem()) { if (sobra <= 0) break; const pg = Math.min(sobra, x.saldo); x.saldo -= pg; sobra -= pg; }
      ds.forEach((x) => { if (x.saldo <= 0.01 && !quit[x.id]) { quit[x.id] = mes; x.saldo = 0; sobra += 0; } });
      /* parcela de quem quitou vira extra para as próximas (efeito bola de neve) */
      ds.forEach((x) => { if (quit[x.id] === mes) extra = (+extra || 0) + x.parcela; });
    }
    return { meses: mes, juros: r2(juros), quit };
  }

  /* ---------- recorrências: materializa os previstos até 12 meses à frente ---------- */
  function materializar(d) {
    const lim = mesSeg(monthKey(hoje()), 12); let mudou = false;
    d.series.forEach((s) => {
      if (s.ativa === false) return;
      let mk = monthKey(s.inicio); const fim = s.fim ? monthKey(s.fim) : lim; const ate = fim < lim ? fim : lim;
      const ja = new Set(d.lanc.filter((l) => l.serieId === s.id).map((l) => l.serieMes));
      const pul = new Set(s.pulados || []);
      while (mk <= ate) {
        if (!ja.has(mk) && !pul.has(mk)) { d.lanc.push(novoLanc(s, mk)); mudou = true; }
        mk = mesSeg(mk, 1);
      }
    });
    return mudou;
  }
  function novoLanc(s, mk) {
    const dt = diaNoMes(mk, s.dia); const base = { id: uid("l"), serieId: s.id, serieMes: mk, desc: s.desc, catId: s.catId, forma: s.forma || "", classe: s.classe || "", valor: r2(s.valor), criado: Date.now(), hist: [{ em: new Date().toISOString(), o: "Criado pela recorrência" }] };
    if (s.cartaoId) { const c = cartao(s.cartaoId) || D().cartoes.find((x) => x.id === s.cartaoId); return Object.assign(base, { tipo: "compra", cartaoId: s.cartaoId, comp: dt, venc: dt, fatura: c ? faturaDe(c, dt).key : mk, pago: null }); }
    return Object.assign(base, { tipo: s.tipo, contaId: s.contaId, paraId: s.paraId || "", comp: dt, venc: dt, pago: null });
  }

  /* ---------- fechamento do mês (trava, como na CAP) ---------- */
  const mesFechado = (mk) => !!D().fechados[mk];
  function travado(l) { return [dataComp(l), dataCaixa(l), l.pago].filter(Boolean).some((dt) => mesFechado(monthKey(dt))); }

  /* categorias novas do plano padrão entram nos dados já existentes (pelo nome) */
  ERP.onBoot = (ERP.onBoot || []).concat(() => { const d = D(); const faltam = planoPadrao().filter((c) => !d.categorias.some((x) => x.nome === c.nome)); if (faltam.length) Store.change("financas", (dd) => faltam.forEach((c) => dd.categorias.push(Object.assign({}, c, { id: uid("c") })))); });

  ERP.fin = { D, PLANO, NAT, DIVIDA_CAT, cat, drePeriodo, saldoEm, historicoSaldo, conta, cartao, faturaDe, faturaPorChave, faturas, faturasAbertas, usoCartao, situacao, dataCaixa, dataComp, saldoConta, saldoTotal, saldoReservas, contasAtivas,
    dreMes, pendencias, projecao, orcado, orcamentoMes, mediaEssencial, dividaInfo, simularDividas, materializar, novoLanc, mesFechado, travado, hoje, addDias, diaNoMes, mesSeg, diasEntre, r2 };
  /* compatibilidade com Início e Patrimônio */
  ERP.custos = { monthFlow: (mk) => { const r = dreMes(mk); return { rec: r.rec, desp: r.despesas + r.investimento }; }, accounts: () => contasAtivas().map((c) => ({ id: c.id, type: c.tipo })), accBalance: (id) => saldoConta(id), billsOpen: () => pendencias().filter((p) => p.tipo === "despesa").map((p) => ({ due: p.data, desc: p.desc, amount: p.valor })) };
})();

</script>
<script>/* js/mod-financas.js */
/* Finanças Pessoais — telas (painel, lançamentos, agenda, cartões, fluxo de caixa, orçamento, dívidas, metas e planejamento, relatórios, cadastros) */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, num, todayISO, fdate, monthKey, monthLabel, addMonths, parseNum, Store } = ERP;
  const F = ERP.fin;
  const D = F.D;
  const S = { mk: monthKey(todayISO()), q: "", tipo: "", sit: "", cat: "", origem: "", card: "", ano: new Date().getFullYear(), extra: 500, metodo: "avalanche", agenda: "pagar", dreAno: new Date().getFullYear(), sel: new Set() };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const hist = (l, o) => { (l.hist = l.hist || []).push({ em: new Date().toISOString(), o }); };
  const salvar = (fn) => Store.change("financas", (d) => { fn(d); F.materializar(d); });

  /* ---------- peças de tela ---------- */
  const pill = (s) => `<span class="pill ${s.cls}">${esc(s.n)}</span>`;

  const mesNav = () => `<button class="btn ghost sm" data-mes="-1" aria-label="Mês anterior">‹</button><b class="fin-mes">${monthLabel(S.mk)}</b><button class="btn ghost sm" data-mes="1" aria-label="Próximo mês">›</button>`;

  const catOpts = (tipo, sel) => { const out = []; let g = ""; D().categorias.filter((c) => c.ativa !== false && (!tipo || c.tipo === tipo || (tipo === "despesa" && c.tipo === "despesa"))).forEach((c) => { if (c.grupo !== g) { g = c.grupo; out.push(["__grp", g]); } out.push([c.id, c.nome]); }); return out; };
  const origemOpts = (comCartao) => F.contasAtivas().map((c) => ["ct:" + c.id, "🏦 " + c.nome]).concat(comCartao ? D().cartoes.filter((c) => c.ativo !== false).map((c) => ["cc:" + c.id, "💳 " + c.nome]) : []);
  const regimeTgl = () => `<div class="tabs fin-tgl" role="group" aria-label="Regime"><button class="${D().cfg.regime === "caixa" ? "on" : ""}" data-reg="caixa" title="Quando o dinheiro entra e sai da conta">Caixa</button><button class="${D().cfg.regime === "competencia" ? "on" : ""}" data-reg="competencia" title="Quando a despesa acontece (compra no cartão conta na data da compra; inclui previstos)">Competência</button></div>`;
  const bindReg = (root) => $$("[data-reg]", root).forEach((b) => (b.onclick = () => { Store.change("financas", (d) => { d.cfg.regime = b.dataset.reg; }); ERP.render(); }));

  /* gráfico de barras pares (azul = entradas, laranja = saídas) */
  function barras(pts) {
    const mx = Math.max(1, ...pts.map((p) => Math.max(p.a, p.b)));
    return `<div class="cols6">${pts.map((p) => `<div class="c"><div class="pair"><i style="height:${(p.a / mx) * 100}%" title="${esc(p.l)} · entradas ${brl(p.a)}"></i><i class="o" style="height:${(p.b / mx) * 100}%" title="${esc(p.l)} · saídas ${brl(p.b)}"></i></div><small>${esc(p.l)}</small></div>`).join("")}</div>`;
  }
  /* linha do saldo projetado (SVG, com linha do zero) */
  function linha(pts) {
    const W = 640, H = 170, pad = 30; if (!pts.length) return "";
    const vs = pts.map((p) => p.v); const mx = Math.max(0, ...vs), mn = Math.min(0, ...vs); const rg = mx - mn || 1;
    const x = (i) => pad + (i * (W - pad * 2)) / Math.max(1, pts.length - 1), y = (v) => 12 + ((mx - v) * (H - 34)) / rg;

    return `<div class="tw" style="border:0"><svg viewBox="0 0 ${W} ${H}" class="fin-svg" role="img" aria-label="Saldo projetado">

      <path d="${path}" class="fin-line"/>${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 4 : 2.5}" class="${p.v < 0 ? "fin-dot neg" : "fin-dot"}"><title>${esc(p.l)} · ${brl(p.v)}</title></circle>`).join("")}
      ${pts.map((p, i) => (i % Math.ceil(pts.length / 6) === 0 || i === pts.length - 1) ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle" class="fin-tx">${esc(p.l)}</text>` : "").join("")}
      <text x="${pad - 4}" y="${y(mx) + 4}" text-anchor="end" class="fin-tx">${num(mx / 1000, 0)}k</text><text x="${pad - 4}" y="${y(mn) + 4}" text-anchor="end" class="fin-tx">${num(mn / 1000, 0)}k</text></svg></div>`;
  }

  /* ---------- lançamento: criar / editar ---------- */
  function lancForm(l, pre) {

    const origem = l.cartaoId ? "cc:" + l.cartaoId : "ct:" + (l.contaId || "");
    const fields = [
      { k: "tipo", label: "Tipo", type: "select", value: l.tipo === "compra" ? "despesa" : l.tipo, options: [["despesa", "Despesa (−)"], ["receita", "Receita (+)"], ["transferencia", "Transferência entre contas"]] },
      { k: "valor", label: novo ? "Valor (R$) — no parcelado, o total" : "Valor (R$)", type: "number", step: "0.01", value: l.valor, required: true },
      { k: "desc", label: "Descrição", value: l.desc, full: true, required: true, placeholder: "Ex.: Mercado, Aluguel, Salário" },
      { k: "catId", label: "Categoria", type: "select", value: l.catId, options: catOpts("despesa") },
      { k: "origem", label: "Pago com / recebido em", type: "select", value: origem, options: origemOpts(true) },

      onSubmit(v) {

        const [ok, oid] = v.origem.split(":"); const cc = ok === "cc" && v.tipo === "despesa";
        if (v.tipo === "transferencia" && v.paraId === oid) { ERP.toast("Escolha contas diferentes na transferência."); return false; }
        if (!v.comp) v.comp = todayISO(); if (!v.venc || cc) v.venc = v.comp;
        if (novo && [v.comp, v.venc].some((dt) => F.mesFechado(monthKey(dt)))) { ERP.toast("Esse mês está fechado. Reabra em Cadastros › Fechamento."); return false; }
        salvar((dd) => {
          const base = { desc: v.desc.trim(), catId: v.tipo === "transferencia" ? "" : v.catId, notas: v.notas || "", forma: v.forma || (cc ? "Cartão de crédito" : ""), classe: v.tipo === "despesa" && !cc ? v.classe || "" : "" };
          if (!novo) {

            Object.assign(x, base, { valor: F.r2(v.valor), comp: v.comp });

            hist(x, "Editado" + (antes !== x.valor ? ` (valor ${brl(antes)} → ${brl(x.valor)})` : ""));

            return;
          }
          const n = Math.max(1, Math.min(60, Math.round(v.parcelas || 1))); const rep = v.repetir;
          if (rep !== "0" && n === 1) {   /* recorrência */
            const s = { id: uid("s"), tipo: v.tipo, desc: base.desc, catId: base.catId, forma: base.forma, classe: base.classe, valor: F.r2(v.valor), dia: +v.venc.slice(8, 10), inicio: cc ? v.comp : v.venc, fim: rep === "1" ? null : addMonths(cc ? v.comp : v.venc, +rep - 1), contaId: cc ? "" : oid, cartaoId: cc ? oid : "", paraId: v.tipo === "transferencia" ? v.paraId : "", ativa: true };
            dd.series.push(s); F.materializar(dd);

            return;

          const g = n > 1 ? uid("g") : null; const per = Math.floor((v.valor / n) * 100) / 100;
          for (let i = 0; i < n; i++) {
            const val = i === n - 1 ? F.r2(v.valor - per * (n - 1)) : per;

            if (g) x.parcela = { g, n: i + 1, t: n };
            if (cc) { const c = F.cartao(oid); const f0 = F.faturaDe(c, v.comp); Object.assign(x, { tipo: "compra", cartaoId: oid, comp: addMonths(v.comp, i), venc: v.comp, fatura: F.mesSeg(f0.key, i), pago: null }); }
            else { Object.assign(x, { tipo: v.tipo, contaId: oid, paraId: v.tipo === "transferencia" ? v.paraId : "", comp: addMonths(v.comp, i), venc: addMonths(v.venc, i), pago: null }); if (v.jaPago && i === 0) { x.pago = x.venc <= todayISO() ? x.venc : todayISO(); x.valorPago = x.valor; } }
            hist(x, "Criado"); dd.lanc.push(x);
          }
        });

      },

        });

      },

    return m;
  }

  /* pagar / receber (como na CAP: data, conta, juros e multa, desconto) */

    ERP.form({
      title: (rec ? "Receber · " : "Pagar · ") + l.desc, intro: `Valor previsto ${brl(l.valor)} · vencimento ${fdate(l.venc)}`,
      fields: [

        { k: "contaId", label: rec ? "Recebido na conta" : "Pago pela conta", type: "select", value: l.contaId, options: F.contasAtivas().map((c) => [c.id, c.nome]) },

  /* lançamento rápido: "Mercado 250,90 @nubank 3x #alimentação 25/10" — "+" ou "recebi" no início = receita */
  function rapido(txt) {
    let t = " " + txt.trim() + " "; if (!txt.trim()) return;
    const d = D(); let tipo = "despesa", parc = 1, dt = todayISO(), origem = null, catId = "";
    if (/^\s*\+/.test(t) || /\b(recebi|receita)\b/i.test(t)) { tipo = "receita"; t = t.replace(/^\s*\+/, " ").replace(/\b(recebi|receita)\b/i, " "); }
    t = t.replace(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/, (m0, dd, mm, yy) => { const y = yy ? (yy.length === 2 ? "20" + yy : yy) : String(new Date().getFullYear()); dt = y + "-" + ERP.p2(mm) + "-" + ERP.p2(dd); return " "; });
    t = t.replace(/\s(\d{1,2})x\s/i, (m0, n) => { parc = +n; return " "; });
    t = t.replace(/@(\S+)/, (m0, a) => { const k = norm(a); const cc = d.cartoes.find((c) => norm(c.nome).includes(k)); const ct = F.contasAtivas().find((c) => norm(c.nome).includes(k)); origem = cc && tipo === "despesa" ? "cc:" + cc.id : ct ? "ct:" + ct.id : null; return " "; });
    t = t.replace(/#(\S+)/, (m0, a) => { const k = norm(a); const c = d.categorias.find((x) => norm(x.nome).includes(k) && x.tipo === (tipo === "receita" ? "receita" : "despesa")); if (c) catId = c.id; return " "; });
    let valor = 0; t = t.replace(/\s(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s/, (m0, v) => { valor = parseNum(v); return " "; });
    const desc = t.replace(/\s+/g, " ").trim();
    if (!catId) { const w = norm(desc).split(" ").filter((x) => x.length > 3); const c = d.categorias.find((x) => x.tipo === (tipo === "receita" ? "receita" : "despesa") && w.some((p) => norm(x.nome).includes(p))); if (c) catId = c.id; }
    if (!valor || !desc) { ERP.toast("Escreva ao menos descrição e valor. Ex.: Mercado 250,90 @nubank"); return; }
    const pre = { tipo, catId };
    const m = lancForm(null, pre); if (!m) return; const fm = $("form", m.el);
    fm.elements.valor.value = valor; fm.elements.desc.value = desc; fm.elements.comp.value = dt; fm.elements.venc.value = dt; fm.elements.parcelas.value = parc;
    fm.elements.tipo.value = tipo; fm.elements.tipo.onchange(); if (origem) { fm.elements.origem.value = origem; fm.elements.origem.onchange(); } if (catId) fm.elements.catId.value = catId;
    fm.elements.jaPago.checked = dt <= todayISO();
  }

  /* ---------- 1. Painel ---------- */
  function pPainel(root) {

    const fimMes = pj.porMes[0] ? pj.porMes[0].saldo : pj.ini;
    const alertas = [];

    const cats = Object.entries(r.porCat).filter(([k]) => F.cat(k).tipo === "despesa").sort((a, b) => b[1] - a[1]).slice(0, 8); const mx = cats.length ? cats[0][1] : 1;

      ${alertas.length ? `<div class="fin-alertas">${alertas.map(([c, t, hr]) => `<a class="note ${c === "err" ? "err" : ""}" href="${hr}">${esc(t)}</a>`).join("")}</div>` : ""}

  /* ---------- 7. Dívidas ---------- */
  function dividaForm(dv) {

        { k: "prox", label: "Próximo vencimento", type: "date", value: inf && inf.proxima ? inf.proxima.venc : F.diaNoMes(F.mesSeg(monthKey(todayISO()), 1), dv.dia) },
        { k: "taxa", label: "Juros (% ao mês)", type: "number", step: "0.01", value: dv.taxa, hint: "Usado no saldo devedor e no plano de quitação" },
        { k: "contaId", label: "Paga pela conta", type: "select", value: dv.contaId, options: F.contasAtivas().map((c) => [c.id, c.nome]) },

          d.lanc = d.lanc.filter((l) => !(l.dividaId === x.id && !l.pago));

  /* ---------- 8. Metas e planejamento ---------- */
  function pMetas(root) {
    const d = D(); const c = d.cfg; const h = todayISO();
    const media = F.mediaEssencial(6); const alvoRes = media * (c.reservaMeses || 6);
    const metaRes = d.metas.find((m) => m.reserva); const guardRes = (metaRes ? +metaRes.guardado : 0) + F.saldoReservas();
    const pat = ERP.patrimonio ? ERP.patrimonio.total().net : 0;
    const anos = Math.max(1, (c.idadeApos || 60) - (c.idade || 40)); const n = anos * 12; const i = Math.pow(1 + (c.retornoReal || 4) / 100, 1 / 12) - 1;
    const alvoApos = (c.rendaDesejada || 0) * 12 / 0.04;
    const fvAtual = pat * Math.pow(1 + i, n); const falta = Math.max(0, alvoApos - fvAtual);

        ${linha(proj)}<p class="mut fin-leg">Projeção com patrimônio líquido de hoje (${brl(pat)}) e aporte de ${brl(c.aporteApos)}/mês. <a href="javascript:void 0" id="mApo">Ajustar premissas</a></p></div></div>

    const metaForm = (m) => { const nova = !m; m = m || { guardado: 0 }; ERP.form({ title: nova ? "Nova meta" : "Editar meta", fields: [{ k: "nome", label: "Nome", value: m.nome, required: true, full: true }, { k: "alvo", label: "Valor alvo (R$)", type: "number", step: "0.01", value: m.alvo }, { k: "guardado", label: "Já guardado (R$)", type: "number", step: "0.01", value: m.guardado }, { k: "prazo", label: "Prazo", type: "date", value: m.prazo }, { k: "reserva", label: "É a reserva de emergência", type: "checkbox", value: m.reserva }], onSubmit(v) { Store.change("financas", (dd) => { if (nova) dd.metas.push(Object.assign({ id: uid("mt"), hist: [] }, v)); else Object.assign(dd.metas.find((x) => x.id === m.id), v); }); ERP.render(); }, onDelete: nova ? null : () => { Store.change("financas", (dd) => { dd.metas = dd.metas.filter((x) => x.id !== m.id); }); ERP.render(); } }); };

      const dv = { id: "ex_dv", nome: "Empréstimo exemplo", credor: "Banco exemplo", tipo: "emprestimo", prioridade: "Alta", taxa: 2.9, contaId: "ex_ct", dia: 18, ex: 1 }; d.dividas.push(dv);
      for (let i = 0; i < 14; i++) { const dt = F.diaNoMes(F.mesSeg(mk, i), 18); d.lanc.push({ id: uid("l"), tipo: "despesa", dividaId: "ex_dv", desc: "Empréstimo exemplo · parcela", catId: F.DIVIDA_CAT, valor: 780, contaId: "ex_ct", comp: dt, venc: dt, pago: null, ex: 1 }); }
      d.metas.push({ id: "ex_mt", nome: "Viagem de férias (exemplo)", alvo: 15000, guardado: 4200, prazo: F.diaNoMes(F.mesSeg(mk, 9), 1), ex: 1 });
      d.orcamento.meses[mk] = Object.assign({}, d.orcamento.meses[mk], { [c("Mercado")]: 1400, [c("Restaurantes e delivery")]: 600, [c("Farmácia")]: 200, [c("Viagens")]: 500 });
    });
    ERP.toast("Exemplo carregado. Para tirar: Sistema › Remover exemplos."); ERP.render();
  };
  ERP.finRemoverExemplo = function () {
    Store.change("financas", (d) => { d.lanc = d.lanc.filter((l) => !l.ex && !["ex_ct", "ex_cc"].includes(l.contaId) && l.cartaoId !== "ex_cc" && l.dividaId !== "ex_dv"); d.series = d.series.filter((s) => !s.ex); d.contas = d.contas.filter((c) => !c.ex); d.cartoes = d.cartoes.filter((c) => !c.ex); d.dividas = d.dividas.filter((c) => !c.ex); d.metas = d.metas.filter((c) => !c.ex); delete d.orcamento.meses[monthKey(todayISO())]; });
    ERP.toast("Exemplos removidos."); ERP.render();
  };
  ERP.temExemplo = () => D().contas.some((c) => c.ex);

  /* materializa recorrências ao abrir (sem marcar como alterado se nada mudou) */
  ERP.onBoot = (ERP.onBoot || []).concat(() => { const d = D(); const antes = d.lanc.length; F.materializar(d); if (d.lanc.length !== antes) Store.change("financas", () => {}); });

  ERP.finUI = { S, lancForm, pagar, estornar, pagarFatura, rapido, salvar, hist, pill, sinal, catOpts, origemOpts, barras, linha };
  ERP.register({ id: "financas", label: "Finanças Pessoais", short: "Finanças", icon: "wallet", group: "Finanças", pages: [
    { id: "painel", label: "Painel", render: pPainel }, { id: "lancamentos", label: "Lançamentos", render: pLanc }, { id: "agenda", label: "A pagar e a receber", render: pAgenda },
    { id: "cartoes", label: "Cartões", render: pCartoes }, { id: "fluxo", label: "Fluxo de caixa", render: pFluxo }, { id: "orcamento", label: "Orçamento", render: pOrc },
    { id: "dividas", label: "Dívidas", render: pDividas }, { id: "metas", label: "Metas e planejamento", render: pMetas }, { id: "relatorios", label: "Relatórios", render: pRel }, { id: "cadastros", label: "Cadastros", render: pCad } ] });
})();

</script>
<script>/* js/fin-painel.js */
/* Finanças Pessoais — Painel e Extratos no formato do Piloto 3.0 (posição bancária, desempenho, resultado do período,
   composição das saídas, demonstrativos, fluxo de caixa 12 + 12 meses, evolução do saldo, análise gráfica, lançamentos ±30 dias). */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, num, todayISO, fdate, monthKey, monthLabel, Store } = ERP;
  const F = ERP.fin, U = ERP.finUI, D = F.D, S = U.S;
  const MES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
  S.pAno = S.pAno || new Date().getFullYear(); if (S.pMes == null) S.pMes = 0;   /* 0 = ano todo, como no Piloto */
  S.perfHor = S.perfHor || "mtd"; S.fluxoVis = S.fluxoVis || "tudo"; S.ext = S.ext || "entradas"; S.pq = S.pq || ""; S.pt = S.pt || "";

  const reg = () => D().cfg.regime;
  const mks = () => (S.pMes ? [S.pAno + "-" + ERP.p2(S.pMes)] : MES.map((_, i) => S.pAno + "-" + ERP.p2(i + 1)));
  const perLbl = () => (S.pMes ? MES[S.pMes - 1] + "/" + String(S.pAno).slice(2) : "ano de " + S.pAno);
  const alpha = (hex, a) => { const h = hex.replace("#", ""); if (h.length < 6) return hex; return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
  const kfmt = (v) => (Math.abs(v) >= 1000 ? num(v / 1000, Math.abs(v) >= 10000 ? 0 : 1) + " mil" : num(v, 0));
  const CORES = () => ({ ent: ERP.cor("--ok"), sai: ERP.cor("--err"), acu: ERP.cor("--orange"), navy: ERP.cor("--navy"), ink2: ERP.cor("--ink-2"), line: ERP.cor("--line"), fixo: "#3F6DB3", variavel: "#C9922E", cartao: "#8A63C2" });
  const DL = { display: (c) => !!c.dataset.data[c.dataIndex], anchor: "end", align: "top", offset: -2, clamp: true, font: { size: 9, weight: "700" }, formatter: (v) => (v ? Math.round(v).toLocaleString("pt-BR") : "") };
  const eixoR$ = { ticks: { callback: (v) => kfmt(v) }, grid: { color: () => ERP.cor("--line") } };
  const tip = { callbacks: { label: (c) => ` ${c.dataset.label || c.label}: ${brl(c.parsed.y != null ? c.parsed.y : c.parsed)}` } };

  /* ---------- lançamentos do período, no regime escolhido (mesma base dos números do painel) ---------- */
  function lancsPeriodo(kind) {
    const set = new Set(mks()); const r = reg(); const out = [];
    D().lanc.forEach((l) => {
      const c = F.cat(l.catId); const inv = c.natureza === "investimento";
      let dt, v;
      if (r === "caixa") { if (!l.pago || !["receita", "despesa", "pagfatura"].includes(l.tipo)) return; dt = l.pago; v = l.valorPago != null ? l.valorPago : l.valor; }
      else { if (!["receita", "despesa", "compra", "estorno"].includes(l.tipo)) return; dt = F.dataComp(l); v = l.tipo === "estorno" ? -l.valor : l.valor; }
      if (!set.has(monthKey(dt))) return;
      const cartao = l.tipo === "compra" || l.tipo === "estorno" || l.tipo === "pagfatura";
      const cls = cartao ? "cartao" : l.classe || (c.fixo ? "fixo" : "variavel");
      const ok = kind === "entradas" ? l.tipo === "receita" && !inv
        : kind === "saidas" ? l.tipo !== "receita" && !inv
        : kind === "fixos" ? !cartao && l.tipo === "despesa" && !inv && cls === "fixo"
        : kind === "variaveis" ? !cartao && l.tipo === "despesa" && !inv && cls === "variavel"
        : kind === "cartao" ? cartao : true;
      if (ok) out.push({ l, dt, v });
    });
    return out.sort((a, b) => b.dt.localeCompare(a.dt));
  }
  /* caixa realizado de um mês (entradas e saídas das contas do dia a dia) */
  function caixaMes(mk) {
    let ent = 0, sai = 0; const ids = new Set(F.contasAtivas().filter((c) => c.tipo !== "reserva").map((c) => c.id));
    D().lanc.forEach((l) => { if (!l.pago || monthKey(l.pago) !== mk || !ids.has(l.contaId)) return; const v = l.valorPago != null ? l.valorPago : l.valor; if (l.tipo === "receita") ent += v; else if (l.tipo === "despesa" || l.tipo === "pagfatura") sai += v; });
    return { ent, sai };
  }

  /* ---------- peças ---------- */
  function filtros() {
    const anos = new Set([new Date().getFullYear(), S.pAno]); D().lanc.forEach((l) => anos.add(+String(F.dataComp(l)).slice(0, 4)));
    return `<div class="card fp-filtros"><label for="fpAno" class="fp-lbl">Ano</label><select id="fpAno">${[...anos].filter(Boolean).sort().map((a) => `<option ${a === S.pAno ? "selected" : ""}>${a}</option>`).join("")}</select>
      <div class="fp-meses"><button class="${S.pMes === 0 ? "on" : ""}" data-pm="0">Ano todo</button>${MES.map((m, i) => `<button class="${S.pMes === i + 1 ? "on" : ""}" data-pm="${i + 1}">${m}</button>`).join("")}</div>
      <div class="tabs fin-tgl" role="group" aria-label="Regime"><button class="${reg() === "caixa" ? "on" : ""}" data-reg="caixa" title="Só o que foi pago e recebido, nas datas do pagamento">Regime de caixa</button><button class="${reg() === "competencia" ? "on" : ""}" data-reg="competencia" title="Pela data da compra/competência, incluindo os previstos">Incluir previstos</button></div></div>`;
  }
  function bindFiltros(root) {
    $("#fpAno", root).onchange = (e) => { S.pAno = +e.target.value; ERP.render(); };
    $$("[data-pm]", root).forEach((b) => (b.onclick = () => { S.pMes = +b.dataset.pm; if (S.pMes) S.mk = S.pAno + "-" + ERP.p2(S.pMes); ERP.render(); }));
    $$("[data-reg]", root).forEach((b) => (b.onclick = () => { Store.change("financas", (d) => { d.cfg.regime = b.dataset.reg; }); ERP.render(); }));
  }
  const sec = (t, n) => `<h2 class="fp-sec">${esc(t)}${n ? ` <small>${esc(n)}</small>` : ""}</h2>`;
  const kpiL = (l, v, s, cls, href, cor) => `<${href ? `a href="${href}"` : "div"} class="kpi fp-k ${cls || ""}" ${cor ? `style="--kc:${cor}"` : ""}><div class="l">${l}${href ? " ↗" : ""}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</${href ? "a" : "div"}>`;
  const canvas = (id, h) => `<div class="fp-chart" style="height:${h || 240}px"><canvas id="${id}"></canvas></div>`;

  function conferirSaldo(id) {
    const c = F.conta(id); const atual = F.saldoConta(id);
    ERP.form({ title: "Conferir saldo · " + c.nome, intro: `Pelo ERP, o saldo hoje é <b>${brl(atual)}</b>. Digite o saldo do extrato do banco; a diferença vira um lançamento de ajuste (fora da DRE), registrado no histórico.`,
      fields: [{ k: "saldo", label: "Saldo do extrato hoje (R$, negativo com −)", type: "number", step: "0.01", value: atual }, { k: "obs", label: "Observação", full: true, placeholder: "Ex.: tarifa não lançada" }],
      okLabel: "Ajustar saldo",
      onSubmit(v) { const dif = F.r2(v.saldo - atual); if (!dif) { ERP.toast("Saldo já confere com o extrato."); return; } U.salvar((d) => d.lanc.push({ id: uid("l"), tipo: "ajuste", contaId: id, valor: dif, desc: "Ajuste de saldo (conferência com o extrato)", notas: v.obs || "", comp: todayISO(), venc: todayISO(), pago: todayISO(), hist: [{ em: new Date().toISOString(), o: `Saldo conferido: ERP ${brl(atual)} → extrato ${brl(v.saldo)} (${dif > 0 ? "+" : ""}${brl(dif)})` }] })); ERP.toast("Saldo ajustado."); ERP.render(); } });
  }

  /* ---------- PAINEL ---------- */
  function pPainel(root) {
    const d = D(); const h = todayISO(); const R = F.drePeriodo(mks()); const C = CORES();
    const pend = F.pendencias(); const fat = F.faturasAbertas(); const fatTot = fat.reduce((s, f) => s + f.total, 0);
    const pj = F.projecao(12);
    const contas = F.contasAtivas().filter((c) => c.tipo !== "reserva");
    const venc = pend.filter((p) => p.tipo !== "receita" && p.data < h); const ap = pend.filter((p) => p.tipo !== "receita");
    const ap15 = ap.filter((p) => p.data >= h && p.data <= F.addDias(h, 15)).reduce((s, p) => s + p.valor, 0);
    const mLim = S.pMes || 12; let acu = 0; for (let i = 1; i <= mLim; i++) acu += F.dreMes(S.pAno + "-" + ERP.p2(i)).resultado;
    const pc = (v) => (R.despesas > 0 ? num((v / R.despesas) * 100, 0) + "% das saídas" : "—");
    /* alertas */
    const alertas = [];
    if (venc.length) alertas.push(["err", `${venc.length} conta(s) vencida(s), ${brl(venc.reduce((s, p) => s + p.valor, 0))}`, "#/financas/agenda"]);
    if (pj.min.v < 0 && pj.ini >= 0) alertas.push(["err", `O saldo projetado fica negativo em ${fdate(pj.min.data)} (${brl(pj.min.v)})`, "#/financas/fluxo"]);
    d.cartoes.forEach((c) => { const u = F.usoCartao(c.id); if (c.limite > 0 && (u / c.limite) * 100 >= (d.cfg.alertaCartao || 80)) alertas.push(["warn", `${c.nome}: ${num((u / c.limite) * 100, 0)}% do limite usado`, "#/financas/cartoes"]); });
    if (S.pMes) F.orcamentoMes(mks()[0]).filter((x) => x.orcado > 0 && x.pct > 100).forEach((x) => alertas.push(["warn", `Orçamento estourado em ${x.c.nome}: ${brl(x.realizado)} de ${brl(x.orcado)}`, "#/financas/orcamento"]));
    /* janela ±30 dias */
    const a = F.addDias(h, -30), b = F.addDias(h, 30); const q = S.pq.toLowerCase();
    const jan = d.lanc.filter((l) => l.tipo !== "ajuste" || true).filter((l) => { const dt = l.tipo === "compra" || l.tipo === "estorno" ? l.comp : F.dataCaixa(l); return dt >= a && dt <= b; })
      .filter((l) => (!S.pt || (S.pt === "despesa" ? ["despesa", "compra", "pagfatura"].includes(l.tipo) : l.tipo === S.pt)) && (!q || (l.desc + " " + F.cat(l.catId).nome).toLowerCase().includes(q)))
      .sort((x, y) => (y.tipo === "compra" ? y.comp : F.dataCaixa(y)).localeCompare(x.tipo === "compra" ? x.comp : F.dataCaixa(x)));
    const liq = jan.reduce((s, l) => s + (l.tipo === "receita" ? 1 : l.tipo === "ajuste" ? Math.sign(l.valor) : l.tipo === "transferencia" ? 0 : -1) * Math.abs(l.valor), 0);

    root.innerHTML = ERP.pagehead("Controle de Finanças", `<button class="btn ghost" id="fpConf">Conferir saldo</button><button class="btn orange" id="fpNovo">+ Novo lançamento</button>`) + filtros() + `
      ${alertas.length ? `<div class="fin-alertas">${alertas.map(([c, t, hr]) => `<a class="note ${c === "err" ? "err" : ""}" href="${hr}">${esc(t)}</a>`).join("")}</div>` : ""}
      ${sec("Posição bancária", "saldos reais de hoje")}
      <div class="kpis fp-2">${contas.map((c) => { const s = F.saldoConta(c.id); const lim = +c.limite || 0; return `<button class="kpi fp-k fp-btn ${s < 0 ? "neg" : ""}" data-conf="${c.id}" style="--kc:var(${s < 0 ? "--err" : "--ok"})" title="Conferir com o extrato"><div class="l">Saldo em conta · ${esc(c.nome)} ✎</div><div class="v">${brl(s)}</div><div class="s">${s < 0 && lim ? `Usando o cheque especial · disponível <b>${brl(lim + s)}</b> de <b>${brl(lim)}</b>` : lim ? `Cheque especial de ${brl(lim)} disponível` : esc(c.banco || "Toque para conferir com o extrato")}</div></button>`; }).join("")}
        ${kpiL("Faturas futuras já comprometidas", brl(fatTot), fat.length ? `${fat.length} fatura(s) · ${fdate(fat.map((f) => f.vence).sort()[0]).slice(0, 5)} a ${fdate(fat.map((f) => f.vence).sort().pop()).slice(0, 5)}` : "nenhuma fatura em aberto", "", "#/financas/cartoes", "var(--warn)")}</div>
      ${sec("Desempenho", "só o que já foi pago ou recebido")}
      <div class="card"><div class="fp-perf"><div><div class="fp-big" id="fpBig">—</div><div class="mut fp-sub" id="fpPerfSub"></div></div><div class="tabs fin-tgl">${[["7", "1 sem"], ["mtd", "MTD"], ["30", "1 m"], ["90", "3 m"], ["ytd", "YTD"], ["tudo", "Tudo"]].map(([k, n]) => `<button class="${S.perfHor === k ? "on" : ""}" data-hor="${k}">${n}</button>`).join("")}</div></div>${canvas("chPerf", 260)}</div>
      ${sec("Resultado do período")}
      <div class="kpis fp-4">${kpiL("Entradas (+)", brl(R.rec), `<b>${R.nE}</b> lançamento(s) · ${perLbl()}`, "pos", "#/financas/extratos", "var(--ok)")}${kpiL("Saídas (−)", brl(R.despesas), `<b>${R.nS}</b> lançamento(s) · ${perLbl()}`, "neg", "#/financas/extratos", "var(--err)")}${kpiL("Resultado (=)", brl(R.resultado), R.rec > 0 ? `Margem de <b>${num((R.resultado / R.rec) * 100, 1)}%</b> sobre as entradas` : "—", R.resultado >= 0 ? "pos" : "neg")}${kpiL("Saldo acumulado no ano", brl(acu), `Soma dos resultados de Jan a ${MES[mLim - 1]}/${String(S.pAno).slice(2)} · não inclui o saldo bancário`, acu < 0 ? "neg" : "")}</div>
      ${sec("Composição das saídas")}
      <div class="kpis fp-4">${kpiL("Custos fixos", brl(R.fixo), pc(R.fixo), "", "#/financas/extratos", C.fixo)}${kpiL("Custos variáveis", brl(R.variavel), pc(R.variavel), "", "#/financas/extratos", C.variavel)}${kpiL("Cartão de crédito", brl(R.cartao), pc(R.cartao), "", "#/financas/cartoes", C.cartao)}${kpiL("Contas a pagar · 30 dias", brl(ap.filter((p) => p.data <= F.addDias(h, 30)).reduce((s, p) => s + p.valor, 0)), `${venc.length ? `<b class="neg">${venc.length} vencida(s)</b> · ` : ""}${brl(ap15)} nos próximos 15 dias<br>previsto em 12 meses: ${brl(ap.reduce((s, p) => s + p.valor, 0))}`, venc.length ? "neg" : "", "#/financas/agenda", "var(--navy)")}</div>
      ${sec("Demonstrativos contábeis")}
      <div class="fp-dem"><div class="card"><h3 class="fp-h3">DRE pessoal <small>${perLbl()}</small></h3><div class="fp-dre">
        ${[["Receitas do período", R.rec], ["(−) Necessidades", -R.essencial], ["(−) Estilo de vida", -R.estilo], ["(−) Financeiro (juros, tarifas, dívidas)", -R.financeiro]].map(([n, v]) => `<div class="row"><span>${n}</span><span class="${v < 0 ? "neg" : ""}">${v < 0 ? "− " + brl(-v) : brl(v)}</span></div>`).join("")}
        <div class="row total"><span>(=) Resultado</span><span class="${R.resultado >= 0 ? "pos" : "neg"}">${brl(R.resultado)}</span></div>
        <div class="row sub"><span>Margem sobre as receitas</span><span>${R.rec > 0 ? num((R.resultado / R.rec) * 100, 1) + "%" : "—"}</span></div>
        <div class="row"><span>(−) Investimentos e reservas</span><span>${R.investimento ? "− " + brl(R.investimento) : brl(0)}</span></div>
        <div class="row total"><span>(=) Saldo livre</span><span class="${R.livre >= 0 ? "pos" : "neg"}">${brl(R.livre)}</span></div>
        <div class="row sub"><span>Fixos · variáveis · cartão</span><span>${brl(R.fixo)} · ${brl(R.variavel)} · ${brl(R.cartao)}</span></div></div></div>
      <div class="fp-col"><div class="fp-right"><div class="tabs fin-tgl">${[["tudo", "Tudo"], ["res", "Resultado"], ["es", "Entrada × Saída"]].map(([k, n]) => `<button class="${S.fluxoVis === k ? "on" : ""}" data-fv="${k}">${n}</button>`).join("")}</div></div>
        <div class="card"><h3 class="fp-h3">Fluxo dos últimos 12 meses <small>realizado · entradas × saídas × acumulado</small></h3>${canvas("chHist", 220)}<p class="mut fin-leg" id="fpHistLg"></p></div>
        <div class="card"><h3 class="fp-h3">Fluxo dos próximos 12 meses <small>previstos cadastrados + faturas em aberto</small></h3>${canvas("chProj", 220)}<p class="mut fin-leg" id="fpProjLg"></p></div></div></div>
      <div class="card"><h3 class="fp-h3">Evolução do saldo <small>mês a mês: saldo anterior + entradas − saídas · previstos + faturas</small></h3><div class="tw"><table><thead><tr><th>Mês</th><th class="r">Entradas (+)</th><th class="r">Saídas (−)</th><th class="r">Resultado</th><th class="r">Acumulado</th><th class="r">Saldo</th></tr></thead><tbody>
        <tr><td>Posição hoje</td><td class="r mut">—</td><td class="r mut">—</td><td class="r mut">—</td><td class="r mut">—</td><td class="r">${U.sinal(pj.ini)}</td></tr>
        ${(() => { let ac = 0; return pj.porMes.map((m) => { const r = m.ent - m.sai; ac += r; return `<tr><td>${monthLabel(m.mk)}</td><td class="r pos">${m.ent ? "+ " + brl(m.ent) : "—"}</td><td class="r neg">${m.sai ? "− " + brl(m.sai) : "—"}</td><td class="r">${U.sinal(r)}</td><td class="r">${U.sinal(ac)}</td><td class="r"><b>${U.sinal(m.saldo)}</b>${m.juros ? `<div class="mut fin-sub">juros cheque esp. ~${brl(m.juros)}</div>` : ""}</td></tr>`; }).join(""); })()}</tbody></table></div></div>
      ${sec("Análise gráfica")}
      <div class="grid2">
        <div class="card"><h3 class="fp-h3">Evolução das Receitas por mês <small>${S.pAno}</small></h3>${canvas("chRecMes")}</div>
        <div class="card"><h3 class="fp-h3">Evolução das Despesas por mês <small>${S.pAno}</small></h3>${canvas("chDesMes")}</div>
        <div class="card"><h3 class="fp-h3">Receitas × Despesas <small>${perLbl()}</small></h3>${canvas("chRxD")}<p class="mut fin-leg">Receitas ${brl(R.rec)} · Despesas ${brl(R.despesas)}</p></div>
        <div class="card"><h3 class="fp-h3">Saídas por classificação <small>fixo · variável · cartão</small></h3>${canvas("chCls")}<p class="mut fin-leg">Fixo ${brl(R.fixo)} · Variável ${brl(R.variavel)} · Cartão ${brl(R.cartao)}</p></div>
        <div class="card"><h3 class="fp-h3">Análise das Receitas <small>por categoria · ${perLbl()}</small></h3>${canvas("chRecCat")}</div>
        <div class="card"><h3 class="fp-h3">Análise das Despesas <small>por categoria · ${perLbl()}</small></h3>${canvas("chDesCat", 280)}</div>
      </div>
      <div class="card"><h3 class="fp-h3">Contas a Receber × Contas a Pagar <small>previstos + faturas · próximos 12 meses</small></h3>${canvas("chCRP", 240)}</div>

    const fim = S.pMes ? S.pAno + "-" + ERP.p2(S.pMes) : (S.pAno === new Date().getFullYear() ? monthKey(todayISO()) : S.pAno + "-12");

<script>/* js/mod-investimentos.js */
/* Módulo Investimentos — carteira no exterior (IBKR) e no Brasil, movimentações, dividendos e apoio ao IRPF */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, usd, num, pct, todayISO, fdate, Store } = ERP;

  const CLASSES = [["acoes", "Ações / ETF de ações"], ["rf", "Renda fixa / ETF de títulos"], ["commod", "Commodities"], ["cripto", "Criptoativos"], ["fii", "FIIs"], ["outro", "Outro"]];
  const CLN = Object.fromEntries(CLASSES);
  ERP.defaults.investimentos = {
    brokers: [{ id: "ibkr", name: "Interactive Brokers", country: "EUA", currency: "USD" }],
    assets: [],          /* {id,ticker,name,cls,brokerId,currency,price,priceAt,irpf} */
    moves: [],           /* {id,date,kind:compra|venda|dividendo|juros|imposto|deposito|saque|taxa,assetId,brokerId,qty,price,amount,fees,fx,notes} */
    fx: { current: 5.40, currentAt: "", ptax: { "2025-12-31": 5.5024 } },
    cash: { ibkr: 0 },
  };
  const D = () => Store.get("investimentos");
  const S = { year: new Date().getFullYear() - 1, broker: "" };
  const KIND = [["compra", "Compra"], ["venda", "Venda"], ["dividendo", "Dividendo (bruto)"], ["imposto", "Imposto retido no exterior"], ["juros", "Juros"], ["deposito", "Depósito (remessa)"], ["saque", "Saque"], ["taxa", "Taxa / corretagem"]];
  const KN = Object.fromEntries(KIND);
  const asset = (id) => D().assets.find((a) => a.id === id) || { ticker: "?", name: "" };

  /* posição pelo custo médio: retorna por ativo {qty, costCur, costBRL, realized[]} */
  function positions(until) {
    const P = {};
    D().moves.filter((m) => (!until || m.date <= until) && (m.kind === "compra" || m.kind === "venda")).sort((a, b) => a.date.localeCompare(b.date) || (a.kind === "compra" ? -1 : 1)).forEach((m) => {
      const p = (P[m.assetId] = P[m.assetId] || { qty: 0, costCur: 0, costBRL: 0, realized: [] });
      const fx = +m.fx || ptaxOn(m.date);
      if (m.kind === "compra") { const c = m.qty * m.price + (+m.fees || 0); p.qty += m.qty; p.costCur += c; p.costBRL += c * fx; }
      else {
        const share = p.qty > 0 ? Math.min(1, m.qty / p.qty) : 0; const cCur = p.costCur * share, cBRL = p.costBRL * share;
        const procCur = m.qty * m.price - (+m.fees || 0);
        p.realized.push({ date: m.date, qty: m.qty, procCur, procBRL: procCur * fx, costCur: cCur, costBRL: cBRL, gainBRL: procCur * fx - cBRL });
        p.qty -= m.qty; p.costCur -= cCur; p.costBRL -= cBRL; if (p.qty < 1e-9) { p.qty = 0; p.costCur = 0; p.costBRL = 0; }
      }
    });
    return P;
  }
  function ptaxOn(date) { const t = D().fx.ptax; const ks = Object.keys(t).filter((k) => k <= date).sort(); return ks.length ? +t[ks[ks.length - 1]] : +D().fx.current || 0; }
  function carteira() {
    const P = positions(); const d = D(); const rows = [];
    d.assets.forEach((a) => { const p = P[a.id]; if (!p || p.qty <= 0) return; const mv = p.qty * (+a.price || 0); rows.push({ a, p, mv, pnl: mv - p.costCur }); });
    const mvUSD = rows.filter((r) => r.a.currency === "USD").reduce((s, r) => s + r.mv, 0);
    const mvBRL = rows.filter((r) => r.a.currency === "BRL").reduce((s, r) => s + r.mv, 0);
    const cashUSD = Object.values(d.cash || {}).reduce((s, v) => s + (+v || 0), 0);
    return { rows, mvUSD, mvBRL, cashUSD, totalBRL: (mvUSD + cashUSD) * (+d.fx.current || 0) + mvBRL };
  }
  ERP.investimentos = { carteira, fx: () => D().fx.current };

  /* ---------- formulários ---------- */
  function moveForm(m) {
    const d = D(); const isNew = !m; m = m || { date: todayISO(), kind: "compra", brokerId: (d.brokers[0] || {}).id, fees: 0 };
    ERP.form({
      title: isNew ? "Nova movimentação" : "Editar movimentação", wide: true,

        { k: "date", label: "Data", type: "date", value: m.date, required: true },
        { k: "assetId", label: "Ativo", type: "select", value: m.assetId, options: [["", "— (caixa)"]].concat(d.assets.map((a) => [a.id, a.ticker + " · " + a.name])) },
        { k: "brokerId", label: "Corretora", type: "select", value: m.brokerId, options: d.brokers.map((b) => [b.id, b.name]) },
        { k: "qty", label: "Quantidade (compra/venda)", type: "number", step: "any", value: m.qty },
        { k: "price", label: "Preço unitário", type: "number", step: "any", value: m.price },
        { k: "amount", label: "Valor (dividendo, imposto, juros, depósito, taxa)", type: "number", step: "0.01", value: m.amount },
        { k: "fees", label: "Corretagem", type: "number", step: "0.01", value: m.fees },
        { k: "fx", label: "PTAX da data (R$ por US$)", type: "number", step: "0.0001", value: m.fx },
        { k: "notes", label: "Observação", value: m.notes, full: true },
      ],
      onSubmit(v) {
        if ((v.kind === "compra" || v.kind === "venda") && (!v.assetId || !v.qty || !v.price)) { ERP.toast("Compra/venda precisa de ativo, quantidade e preço."); return false; }
        if (v.kind === "venda") { const p = positions(v.date)[v.assetId]; const have = (p ? p.qty : 0) + (!isNew && m.kind === "venda" && m.assetId === v.assetId ? +m.qty : 0); if (v.qty > have + 1e-6) { ERP.toast(`Quantidade maior que a posição (${num(have, 4)}).`); return false; } }
        Store.change("investimentos", (dd) => { if (isNew) dd.moves.push(Object.assign({ id: uid("mv") }, v)); else Object.assign(dd.moves.find((x) => x.id === m.id), v); });
        ERP.render();
      },
      onDelete: isNew ? null : () => { Store.change("investimentos", (dd) => { dd.moves = dd.moves.filter((x) => x.id !== m.id); }); ERP.render(); },
    });
  }
  function assetForm(a) {
    const d = D(); const isNew = !a; a = a || { currency: "USD", cls: "acoes", brokerId: (d.brokers[0] || {}).id };
    ERP.form({
      title: isNew ? "Novo ativo" : "Editar ativo " + a.ticker,
      fields: [
        { k: "ticker", label: "Ticker", value: a.ticker, required: true }, { k: "name", label: "Nome", value: a.name },
        { k: "cls", label: "Classe", type: "select", value: a.cls, options: CLASSES }, { k: "currency", label: "Moeda", type: "select", value: a.currency, options: [["USD", "USD"], ["BRL", "BRL"], ["EUR", "EUR"]] },
        { k: "brokerId", label: "Corretora", type: "select", value: a.brokerId, options: d.brokers.map((b) => [b.id, b.name]) },

      onDelete: isNew ? null : () => { if (d.moves.some((m) => m.assetId === a.id)) { ERP.toast("Ativo com movimentações — exclua-as antes."); return; } Store.change("investimentos", (dd) => { dd.assets = dd.assets.filter((x) => x.id !== a.id); }); ERP.render(); },
    });

  /* ---------- páginas ---------- */
  function pCarteira(root) {
    const d = D(); const c = carteira(); const fx = +d.fx.current || 0;

      <div class="grid2"><div class="card"><h3>Distribuição por classe</h3>${Object.entries(byCls).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="hrow"><span class="n">${esc(CLN[k] || k)}</span><div class="bar"><i style="width:${(v / tot) * 100}%"></i></div><span class="v">${num((v / tot) * 100, 1)}%</span></div>`).join("") || `<div class="empty">Sem posições.</div>`}</div>
